<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garde-robe</title>
<meta name="description" content="Garde-robe digitale — old money mediterranean">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garde-robe">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f5f1ea;
    --bg-card: #fdfaf4;
    --ink: #2a2419;
    --ink-soft: #6b5d4a;
    --ink-faded: #a89880;
    --accent: #8b5a2b;
    --accent-soft: #c89968;
    --line: #d9cdb8;
    --line-soft: #ebe2cd;
    --alert: #c44d2c;
    --success: #6b8e4e;
    --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
    --sans: 'Inter Tight', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap');

  /* ===== HEADER ===== */
  .app-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .brand {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-style: italic;
  }

  .date {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-faded);
  }

  .tagline {
    font-family: var(--serif);
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    letter-spacing: 0.05em;
  }

  /* ===== NAV ===== */
  .nav {
    display: flex;
    gap: 0;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-card);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 87px;
    z-index: 49;
  }
  .nav::-webkit-scrollbar { display: none; }

  .nav-item {
    flex-shrink: 0;
    padding: 8px 14px;
    margin-right: 4px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .nav-item.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .nav-item:not(.active):hover {
    border-color: var(--line);
  }

  /* ===== MAIN ===== */
  main {
    padding: 24px 20px 100px;
    max-width: 600px;
    margin: 0 auto;
  }

  .section-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .section-subtitle {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faded);
    margin-bottom: 20px;
  }

  /* ===== FILTERS ===== */
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 6px 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--ink-soft);
  }

  .filter-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* ===== VALISE / PACKING ===== */
  .valise-toggle {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    border: 1px solid var(--line); background: var(--bg-card); color: var(--ink-soft);
    padding: 8px 15px; border-radius: 100px; cursor: pointer; transition: all 0.2s;
    margin: 0 0 12px;
  }
  .valise-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .valise-banner {
    background: var(--bg-card); border: 1px dashed var(--accent-soft); border-radius: 8px;
    padding: 11px 14px; margin: 0 0 14px; font-size: 13px; color: var(--ink-soft);
  }
  .valise-banner b { color: var(--accent); font-size: 16px; }
  .valise-clear {
    background: none; border: none; color: var(--alert); font-size: 12px; cursor: pointer;
    text-decoration: underline; padding: 0; font-family: var(--sans);
  }
  .valise-hint { font-size: 11px; color: var(--ink-faded); font-style: italic; margin-top: 6px; line-height: 1.4; }
  .item-card.packed { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: #fbf4ea; }
  .pack-check {
    position: absolute; top: 6px; left: 6px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--accent); background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 700;
  }
  .item-card.packed .pack-check { background: var(--accent); }
  .valise-random {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    border: 1px solid var(--line); background: var(--bg-card); color: var(--ink-soft);
    padding: 7px 15px; border-radius: 100px; cursor: pointer; margin: 0 0 6px;
  }
  .valise-random.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .valise-count { font-size: 13px; color: var(--ink-faded); font-style: italic; font-family: var(--serif); margin: 0 0 14px; text-align: center; }

  /* ===== GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .item-card {
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }

  .item-card:hover {
    border-color: var(--accent-soft);
    transform: translateY(-2px);
  }

  .item-card.needs-wash::after {
    content: '';
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    background: var(--alert);
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--bg-card);
  }

  .item-illustration {
    aspect-ratio: 1;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .item-info {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--line-soft);
  }

  .item-name {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
    line-height: 1.2;
  }

  .item-meta {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faded);
  }

  .item-stats {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-soft);
  }

  .wear-count {
    font-family: var(--mono);
  }

  /* ===== ITEM MODAL ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(42, 36, 25, 0.6);
    z-index: 100;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-illustration {
    aspect-ratio: 1.4;
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    margin-bottom: 20px;
  }

  .modal-name {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .modal-brand {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faded);
    margin-bottom: 20px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13px;
  }

  .detail-label {
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }

  .btn {
    padding: 14px 16px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    transition: all 0.2s;
    flex: 1;
  }

  .btn.primary {
    background: var(--ink);
    color: var(--bg);
  }

  .btn.wash {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }

  .btn.danger {
    background: transparent;
    color: var(--alert);
    border-color: var(--alert);
  }

  .btn:hover { opacity: 0.85; }

  /* ===== PALETTE ===== */
  .palette-section {
    margin-bottom: 32px;
  }

  .palette-header {
    font-family: var(--serif);
    font-size: 18px;
    font-style: italic;
    margin-bottom: 12px;
    color: var(--ink);
  }

  .palette-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .color-chip {
    aspect-ratio: 1;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    border: 1px solid var(--line-soft);
  }

  .color-chip span {
    position: absolute;
    bottom: -18px;
    left: 0;
    right: 0;
    font-size: 9px;
    text-align: center;
    color: var(--ink-soft);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .matter-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }

  .matter-card {
    padding: 14px;
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
  }

  .matter-name {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .matter-desc {
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* ===== TENUES ===== */
  .outfit-card {
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .outfit-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }

  .outfit-name {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    font-style: italic;
  }

  .outfit-level {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: var(--bg);
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--accent-soft);
  }

  .outfit-pieces {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .outfit-piece {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding: 6px 3px;
    background: var(--bg);
    border-radius: 4px;
    font-size: 9px;
    line-height: 1.2;
  }

  .piece-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }

  .subcat-head {
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 24px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .subcat-head:first-of-type { margin-top: 8px; }

  .random-panel {
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
    max-height: 300px;
    overflow-y: auto;
  }
  .rp-legend { font-size: 11px; color: var(--ink-soft); margin-bottom: 10px; }
  .rp-group { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faded); margin: 12px 0 6px; }
  .rp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .rp-chip {
    font-size: 11px; padding: 5px 9px; border-radius: 100px;
    border: 1px solid var(--line); background: var(--bg-card);
    color: var(--ink-soft); cursor: pointer;
  }
  .rp-chip.inc { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .rp-chip.exc { border-color: var(--alert); color: var(--alert); text-decoration: line-through; opacity: .8; }
  .rf-summary { font-size: 12px; color: var(--ink-soft); margin: 8px 0; text-align: center; }
  .rf-reset {
    font-size: 11px; background: transparent; border: 1px solid var(--line);
    border-radius: 100px; padding: 4px 12px; cursor: pointer; color: var(--ink-soft);
  }
  .ai-box {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .ai-drop {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 30px 18px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    background: var(--bg);
  }
  .ai-drop:active { background: var(--line-soft); }
  .ai-preview { width: 100%; border-radius: 8px; margin-bottom: 12px; display: block; }
  .ai-result {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    border-left: 3px solid var(--accent-soft);
    border-radius: 6px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .ai-spin { text-align: center; padding: 22px; color: var(--ink-soft); font-size: 13px; }
  .verdict {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 10px;
  }
  .v-ok   { background: var(--success); color: #fff; }
  .v-adj  { background: var(--accent-soft); color: var(--ink); }
  .v-no   { background: var(--alert); color: #fff; }
  .usage-summary { display: flex; gap: 8px; margin-bottom: 14px; }
  .usage-stat { flex: 1; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 8px; text-align: center; }
  .usage-val { font-size: 18px; font-weight: 700; color: var(--ink); font-family: var(--sans); }
  .usage-lbl { font-size: 10px; color: var(--ink-faded); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
  .usage-sub { font-size: 13px; font-weight: 600; color: var(--ink); margin: 16px 0 8px; }
  .usage-bytask { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .usage-tag { font-size: 11px; background: var(--accent-soft); color: var(--ink); border-radius: 100px; padding: 4px 10px; }
  .usage-row { border-bottom: 1px solid var(--line-soft); padding: 8px 0; }
  .usage-row-head { display: flex; justify-content: space-between; align-items: baseline; }
  .usage-cost { font-family: var(--mono); font-size: 12px; color: var(--ink); font-weight: 600; }
  .usage-row-body { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .prof-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .form-row2 { display: flex; gap: 10px; }
  .form-row2 .form-group { flex: 1; }
  .prof-card-title { font-family: var(--sans); font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .prof-hint { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 12px; }
  .danger-btn { color: var(--alert) !important; border-color: var(--alert) !important; }
  .pal-fam { margin-bottom: 14px; }
  .pal-fam-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pal-band { height: 32px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 6px; }
  .pal-fam-label { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .pal-stops { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pal-stop { display: flex; align-items: center; }
  .pal-stop input[type=color] { width: 30px; height: 30px; border: none; border-radius: 6px; padding: 0; background: none; cursor: pointer; }
  .pal-stopx { background: transparent; border: none; color: var(--ink-faded); cursor: pointer; font-size: 11px; padding: 0 4px; }
  .pal-gen { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .pal-check { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .pal-verdict { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .pal-swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }

  .pal-group { background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .pal-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pal-label { flex: 1; font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--ink); border: none; background: transparent; border-bottom: 1px solid var(--line); padding: 4px 0; }
  .pal-x, .pal-chipx { background: transparent; border: none; color: var(--ink-faded); cursor: pointer; font-size: 14px; padding: 2px 6px; }
  .pal-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .pal-chip { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 100px; padding: 3px 6px 3px 3px; }
  .pal-chip input[type=color] { width: 26px; height: 26px; border: none; border-radius: 50%; padding: 0; background: none; cursor: pointer; }
  .pal-cname { width: 76px; border: none; background: transparent; font-size: 12px; color: var(--ink); font-family: var(--sans); }
  .pal-add { background: var(--bg); border: 1px dashed var(--line); border-radius: 100px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); cursor: pointer; font-family: var(--sans); }

  .gen-panel { margin-bottom: 16px; }
  .gen-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .gen-count { font-size: 12px; color: var(--ink-soft); }
  .gen-btn {
    background: var(--ink); color: var(--bg-card); border: none;
    border-radius: 100px; padding: 8px 16px; font-size: 12px; font-weight: 600;
    font-family: var(--sans); cursor: pointer; white-space: nowrap;
  }
  .gen-pending {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  }
  .gen-pending span { font-size: 12px; color: var(--ink); }
  .gen-pending button {
    background: var(--ink); color: var(--bg-card); border: none;
    border-radius: 100px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .gen-badge {
    font-size: 9px;
    background: var(--line-soft);
    color: var(--ink-soft);
    border-radius: 100px;
    padding: 2px 8px;

<script>
// ============ MOTEUR DE TENUES (100% LOCAL, ZERO TOKEN) ============
// Familles couleur : wl=clair chaud, wd=chaud profond, ol=olive,
// co=marine/froid, cl=chambray/bleu clair, ac=accent, nk=noir/anthracite
// Version multi-utilisateurs : la famille couleur vient de la piece
// (definie a l'ajout par l'analyse IA) ou est estimee depuis la couleur.
const FAMILY_OF = {};

// Estime la famille d'une couleur hex si la piece n'en a pas
function guessFamily(hex) {
  if (!hex || hex[0] !== '#') return 'wl';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const sat = Math.max(r,g,b) - Math.min(r,g,b);
  const lum = r*0.299 + g*0.587 + b*0.114;
  // Bleus AVANT le test sombre : un marine fonce reste du marine, pas du noir
  if (b > r + 20 && b >= g) return lum > 140 ? 'cl' : 'co';
  if (g >= r && g > b + 12) return 'ol';                    // verts / olive
  if (r > g + 50 && r > b + 50) return 'ac';                // terracotta / rouille
  if (sat < 22 && lum < 90) return 'nk';                    // vrai noir/anthracite : desature ET sombre
  if (lum > 165) return 'wl';                               // clairs chauds
  return 'wd';                                              // chauds profonds (dont chocolat tres fonce)
}
function famOf(item) {
  if (!item) return 'wl';
  return item.family || guessFamily(item.color);
}
function tuckableOf(item) {
  return !!(item && item.tuckable);
}

// Regles d'accord haut (au visage) / bas
function compat(tf, bf) {
  if (tf === 'wl') return true;                                  // clair chaud va avec tout
  if (tf === 'wd') return ['wl','wd','ol','co'].includes(bf);
  if (tf === 'ol') return ['wl','wd','co'].includes(bf);         // jamais olive+olive
  if (tf === 'co') return ['wl','wd','ol','ac'].includes(bf);    // jamais marine+marine
  if (tf === 'cl') return ['wl','wd','ol','co'].includes(bf);
  if (tf === 'ac') return ['wl','wd','ol','co'].includes(bf);    // accent jamais double
  if (tf === 'nk') return ['wl','wd','ol','co'].includes(bf);    // noir = layer only
  return false;
}

// Echarpe : froid au visage -> tabac ; fonce/chaud -> creme ; clair -> tabac
function scarfFor(tf) {
  if (tf === 'co' || tf === 'cl') return 'a2';  // tabac rechauffe
  if (tf === 'wd' || tf === 'nk') return 'a6';  // creme eclaire
  return 'a2';                                   // clair -> tabac pour la profondeur
}

function watchFor(level, vibe) {
  if (level >= 3) return 'cuir';
  if (level === 2) return vibe === 'mur' ? 'cuir' : 'acier';
  return 'kaki';
}

const TYPE_LEVEL = {
  'tee': 1, 'polo': 1, 'maille': 1,
  'chemise-lin': 2, 'chemise-coton': 2,
  'veste-lin': 3
};

function tuckTip(bas, topType) {
  if (!tuckableOf(bas)) return "Rien rentre (taille a cordon), pas de ceinture.";
  if (topType && topType.startsWith('chemise')) return "Chemise rentree, ou demi-tuck + ceinture cognac.";
  return "Front-tuck leger + ceinture cognac.";
}
function sleeveTip(topType) {
  if (topType && topType.startsWith('chemise')) return "Rouleau italien 2-3 plis, sous le coude.";
  if (topType === 'maille') return "Maille telle quelle, on n'y touche pas.";
  if (topType === 'polo') return "Manches telles quelles.";
  return "Tee retrousse 1 pli sur l'avant-bras.";
}
function harmonyNote(tf, bf, shoeName) {
  let base;
  if (tf === 'co' || tf === 'cl') base = "Haut froid au visage : l'echarpe tabac et le bas chaud le rechauffent.";
  else if (tf === 'nk') base = "Le fonce n'est jamais seul au visage : garde une couche chaude ouverte par-dessus.";
  else if (tf === 'ac') base = "Le terracotta est ton seul accent : tout le reste reste neutre.";
  else if (bf === 'co') base = "Le bas marine ancre l'ensemble, le chaud reste pres du teint.";
  else base = "Camaieu chaud coherent — un point clair (echarpe ou chaussure) apporte la lumiere.";
  return base + (shoeName ? ' ' + shoeName + ' aux pieds.' : '');
}

// Signature d'une tenue, pour ne pas generer de doublon
function outfitSig(pieces) {
  const h = pieces.filter(p => { const w = wardrobe.find(x => x.id === p); return w && w.category === 'haut'; }).sort();
  const b = pieces.find(p => { const w = wardrobe.find(x => x.id === p); return w && w.category === 'bas'; });
  const c = pieces.find(p => { const w = wardrobe.find(x => x.id === p); return w && w.category === 'chaussure'; });
  return h.join('|') + '#' + (b || '') + '#' + (c || '');
}

// ============ VALIDATION LOCALE (garde-fou, 0 token) ============
// Verifie qu'une tenue renvoyee par Claude ne casse aucune regle dure.
// Si Claude se trompe, on filtre AVANT d'enregistrer.
function outfitFaults(o) {
  const faults = [];
  const get = id => wardrobe.find(w => w.id === id);
  const pieces = (o.pieces || []).map(get).filter(Boolean);
  // On tolère les id inconnus (Claude peut citer un accessoire non catalogué) :
  // on les ignore au lieu de rejeter toute la tenue. On exige juste un haut + un bas réels.
  const hauts = pieces.filter(p => p.category === 'haut');
  const bas = pieces.find(p => p.category === 'bas');
  if (!hauts.length) faults.push('pas de haut');
  if (!bas) faults.push('pas de bas');

  if (pieces.filter(p => famOf(p) === 'ac').length >= 2) faults.push('deux accents');
  if (pieces.filter(p => p.category === 'chaussure').length > 1) faults.push('deux paires de chaussures');

  const beltId = wardrobe.find(w => w.type === 'ceinture');
  if (beltId && o.pieces && o.pieces.includes(beltId.id) && bas && !tuckableOf(bas)) faults.push('ceinture sur cordon');

  return faults;
}

// Normalise une tenue Claude -> format interne + id stable
function normalizeOutfit(o, idx) {
  // ne garde que les pièces réellement présentes dans la garde-robe
  const validPieces = (Array.isArray(o.pieces) ? o.pieces : []).filter(id => wardrobe.some(w => w.id === id));
  return {
    id: 'ai-' + Date.now().toString(36) + '-' + idx,
    generated: true,
    name: o.name || 'Tenue',
    level: [1,2,3,4].includes(o.level) ? o.level : 1,
    vibe: ['jeune','inter','mur'].includes(o.vibe) ? o.vibe : 'inter',
    description: o.description || '',
    pieces: validPieces,
    scarf: (o.scarf && wardrobe.some(w => w.id === o.scarf)) ? o.scarf : null,
    shortSwap: null,
    watch: ['kaki','acier','cuir'].includes(o.watch) ? o.watch : 'kaki',
    hat: o.hat !== false,
    tips: {
      tuck: (o.tips && o.tips.tuck) || '',
      sleeves: (o.tips && o.tips.sleeves) || '',
      scarf: (o.tips && o.tips.scarf) || '',
      note: (o.tips && o.tips.note) || ''
    }
  };
}

// Payload garde-robe envoye a Claude (compact, pour limiter les tokens)
function wardrobePayload() {
  return wardrobe.map(w => ({
    id: w.id, nom: w.name, type: w.type,
    couleur: w.color, matiere: w.material || '',
    famille: famOf(w), passants: tuckableOf(w)
  }));
}

// ---- GENERATION COMPLETE (gros appel, rare) ----
async function generateAllOutfits() {
  const payload = wardrobePayload();
  const text = "Voici ma garde-robe complete (JSON). Compose le maximum de tenues excellentes et variees.\n\n" + JSON.stringify(payload);
  const raw = await callClaude('generate', { text });
  const data = parseJSONLoose(raw);
  if (!data || !Array.isArray(data.outfits)) throw new Error('Reponse de generation illisible');

  const kept = [], dropped = [];
  data.outfits.forEach((o, i) => {
    const n = normalizeOutfit(o, i);
    const f = outfitFaults(n);
    if (f.length === 0) kept.push(n); else dropped.push({ name: n.name, f });
  });

  generatedOutfits = kept;
  await saveGenerated();
  rebuildCatalog();
  return { kept: kept.length, dropped: dropped.length };
}

// ---- GENERATION INCREMENTALE (petit appel, a l'ajout de pieces) ----
async function generateForNewPieces(newIds) {
  const payload = wardrobePayload();
  const text = "Voici ma garde-robe complete (JSON). Je viens d'ajouter ces nouvelles pieces : "
    + JSON.stringify(newIds)
    + ". Compose UNIQUEMENT les nouvelles tenues qui utilisent au moins une de ces pieces.\n\n"
    + JSON.stringify(payload);
  const raw = await callClaude('generate_incremental', { text });
  const data = parseJSONLoose(raw);
  if (!data || !Array.isArray(data.outfits)) throw new Error('Reponse illisible');

  let added = 0;
  data.outfits.forEach((o, i) => {
    const n = normalizeOutfit(o, generatedOutfits.length + i);
    // ne garde que si ca utilise vraiment une nouvelle piece ET zero faute
    if (!n.pieces.some(p => newIds.includes(p))) return;
    if (outfitFaults(n).length) return;
    generatedOutfits.push(n);
    added++;
  });
  await saveGenerated();
  rebuildCatalog();
  return added;
}

// Reconstruit OUTFITS = curatees + generees (0 token)
function rebuildCatalog() {
  OUTFITS = CURATED_OUTFITS.concat(generatedOutfits);
  generatedCount = generatedOutfits.length;
}

// Suppression d'une piece -> retire localement ses tenues (0 token)
function pruneOutfitsForRemovedPiece(pieceId) {
  const before = generatedOutfits.length;
  generatedOutfits = generatedOutfits.filter(o => !o.pieces.includes(pieceId));
  const removed = before - generatedOutfits.length;
  if (removed) { rebuildCatalog(); }
  return removed;
}

// ---- ancienne generation locale conservee en secours (jamais appelee par defaut) ----
function generateOutfits_LOCAL() {
  const hauts = wardrobe.filter(w => w.category === 'haut');
  const bas = wardrobe.filter(w => w.category === 'bas');
  const chaussures = wardrobe.filter(w => w.category === 'chaussure');
  const ceintureCognac = wardrobe.find(w => w.id === 'a3') ? 'a3' : null;
  if (!hauts.length || !bas.length || !chaussures.length) return [];

  // Signatures deja couvertes par les tenues curatees
  const seen = new Set(CURATED_OUTFITS.map(o => outfitSig(o.pieces)));
  const out = [];
  const shoeUse = {};
  chaussures.forEach(c => shoeUse[c.id] = 0);
  let n = 0;

  hauts.forEach(top => {
    const tf = famOf(top);
    // Le noir/anthracite ne se porte pas seul au visage -> exclu du generateur simple
    if (tf === 'nk') return;

    const basOk = bas.filter(b => compat(tf, famOf(b)));
    // Max 3 bas par haut pour eviter l'explosion combinatoire
    basOk.slice(0, 3).forEach(b => {
      // chaussure la moins utilisee d'abord (repartition equilibree)
      const sorted = chaussures.slice().sort((x, y) => shoeUse[x.id] - shoeUse[y.id]);
      const shoe = sorted[0];
      shoeUse[shoe.id]++;

      const belt = (tuckableOf(b) && ceintureCognac) ? [ceintureCognac] : [];
      const pieces = [top.id, b.id, ...belt, shoe.id, 'a5'];
      const sig = outfitSig(pieces);
      if (seen.has(sig)) return;
      seen.add(sig);

      const level = TYPE_LEVEL[top.type] || 1;
      const bf = famOf(b);
      const vibe = level >= 2 ? (tf === 'wd' || tf === 'ol' ? 'mur' : 'inter')
                              : (tf === 'co' || tf === 'cl' ? 'inter' : 'jeune');
      n++;
      out.push({
        id: 'gen-' + n,
        generated: true,
        name: `${top.name} + ${b.name}`,
        level,
        vibe,
        description: `${top.name} + ${b.name} + ${shoe.name}.`,
        pieces,
        scarf: scarfFor(tf),
        shortSwap: null,
        watch: watchFor(level, vibe),
        hat: level <= 2,
        tips: {
          tuck: tuckTip(b, top.type),
          sleeves: sleeveTip(top.type),
          scarf: scarfFor(tf) === 'a2' ? "Tabac." : "Creme.",
          note: harmonyNote(tf, bf, shoe.name)
        }
      });
    });
  });

  return out;
}

// ============ CLIENT API (via /api/claude sur Vercel) ============
// La cle API n'est jamais dans le navigateur : elle vit sur le serveur Vercel.
const API_URL = '/api/claude';

async function callClaude(task, { image, mediaType, text } = {}) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task, image, mediaType, text, stylePrompt: buildStylePrompt() })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erreur ' + r.status);
  if (d.usage) await recordUsage(task, d.usage);   // suivi conso tokens
  return d.result;
}

// Extrait le JSON d'une reponse (au cas ou le modele ajoute du texte autour)
function parseJSONLoose(txt) {
  if (!txt) return null;
  let t = txt.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a !== -1 && b !== -1) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch (e) { return null; }
}

const TOKEN_PRICES = { input: 3.0, output: 15.0 };  // $ / 1M tokens

// Noms lisibles par type de demande

  analyze: 'Analyse de pièce',

function estimateCost(inTok, outTok){
  return (inTok/1e6)*TOKEN_PRICES.input + (outTok/1e6)*TOKEN_PRICES.output;
}

async function recordUsage(task, usage){
  const inTok = usage.input_tokens || 0;
  const outTok = usage.output_tokens || 0;
  const cost = estimateCost(inTok, outTok);
  usageLog.unshift({
    date: new Date().toISOString(),
    task,
    label: TASK_LABELS[task] || task,
    inTok, outTok, cost
  });
  await saveUsageLog();
}

function fmtUsd(n){ return '$' + (n||0).toFixed(4).replace(/0+$/,'').replace(/\\.$/,'.00').replace(/\\.([0-9])$/,'.$10'); }
function fmtUsd2(n){ return '$' + (n||0).toFixed(2); }

function renderUsage(){
  let html = `<div class="prof-card">
    <div class="prof-card-title">Consommation IA</div>`;

  const spent = totalSpent();
  const paid = totalPaid();
  const balance = paid - spent;

  // Résumé
  html += `<div class="usage-summary">
    <div class="usage-stat"><div class="usage-val">${fmtUsd2(spent)}</div><div class="usage-lbl">consommé</div></div>
    <div class="usage-stat"><div class="usage-val">${fmtUsd2(paid)}</div><div class="usage-lbl">payé</div></div>
    <div class="usage-stat"><div class="usage-val" style="color:${balance>=0?'var(--success)':'var(--alert)'}">${fmtUsd2(balance)}</div><div class="usage-lbl">solde</div></div>
  </div>`;

  // Paiements
  html += `<div class="usage-sub">Paiements</div>
    <button class="data-btn" onclick="addPayment()">+ Ajouter un paiement</button>`;
  if (payments.length){
    html += payments.map((p,i)=>`<div class="log-entry">
      <div><div class="log-date">${fmtLogDate(p.date)}</div><div class="log-name">${fmtUsd2(p.amount)}</div></div>
      <button class="log-del" onclick="delPayment(${i})" title="Supprimer">✕</button>
    </div>`).join('');
  }

  // Historique par demande
  html += `<div class="usage-sub">Historique des demandes (${usageLog.length})</div>`;
  if (!usageLog.length){
    html += `<p class="prof-hint">Aucune demande IA pour l'instant.</p>`;
  } else {
    // récap par type
    const byTask = {};
    usageLog.forEach(e=>{ const k=e.label; if(!byTask[k])byTask[k]={n:0,cost:0}; byTask[k].n++; byTask[k].cost+=e.cost; });
    html += `<div class="usage-bytask">` + Object.entries(byTask).map(([k,v])=>
      `<div class="usage-tag">${k} · ${v.n}× · ${fmtUsd2(v.cost)}</div>`).join('') + `</div>`;

    html += usageLog.slice(0,40).map(e=>`
      <div class="usage-row">
        <div class="usage-row-head">
          <span class="log-date">${fmtLogDate(e.date)}</span>
          <span class="usage-cost">${fmtUsd(e.cost)}</span>
        </div>
        <div class="usage-row-body">${e.label} · ↑${e.inTok} ↓${e.outTok} tokens</div>
      </div>`).join('');
    if (usageLog.length>40) html += `<p class="prof-hint">…et ${usageLog.length-40} de plus.</p>`;
    html += `<button class="data-btn danger-btn" onclick="clearUsage()">Vider l'historique de consommation</button>`;
  }

  html += `<p class="prof-hint" style="margin-top:10px">Coûts estimés au tarif Sonnet (${fmtUsd2(TOKEN_PRICES.input)}/M entrée · ${fmtUsd2(TOKEN_PRICES.output)}/M sortie). Indicatif.</p>`;
  html += `</div>`;
  return html;
}

// Prompt complet = infos profil + prompt utilisateur + palette (envoye a l'IA)
function buildStylePrompt() {
  let out = '';

    if (profile.name) bits.push('Prenom : ' + profile.name);
    if (profile.morph) bits.push('Morphologie : ' + profile.morph);
    if (profile.height) bits.push('Taille : ' + profile.height);
    if (profile.weight) bits.push('Poids : ' + profile.weight);
    if (profile.hair) bits.push('Cheveux : ' + profile.hair);
    if (profile.eyes) bits.push('Yeux : ' + profile.eyes);
    if (profile.skin) bits.push('Teint : ' + profile.skin);
    if (bits.length) out += 'PROFIL\n' + bits.join('\n') + '\n\n';
  }
  out += (userStylePrompt || '').trim();
  const fams = (userPalette.families || []).filter(f => (f.stops||[]).length);
  if (fams.length) {
    out += '\n\nPALETTE (familles de couleurs a respecter, donnees en degrades) :';
    fams.forEach(f => { out += `\n- ${f.label} : ${f.stops.join(', ')}`; });
  }
  return out.trim() || "Tu es un coach vestimentaire. Compose des tenues coherentes et flatteuses.";
}

// CSS linear-gradient a partir des stops
function paletteGradient(stops) {
  if (!stops || !stops.length) return 'var(--line-soft)';
  if (stops.length === 1) return stops[0];
  return 'linear-gradient(90deg, ' + stops.join(', ') + ')';
}

  if (!userPalette.families) userPalette.families = [];
}

// ---- Couleur dominante d'une image (canvas, local) ----
function pickImageColor(cb){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const file=inp.files&&inp.files[0]; if(!file)return;
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const S=64, cv=document.createElement('canvas'); cv.width=S; cv.height=S;
        const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,S,S);
        const d=ctx.getImageData(0,0,S,S).data;
        let rS=0,gS=0,bS=0,c=0;
        for(let i=0;i<d.length;i+=4){
          const a=d[i+3]; if(a<200)continue;
          const rr=d[i],gg=d[i+1],bb=d[i+2];
          const mx=Math.max(rr,gg,bb),mn=Math.min(rr,gg,bb);
          if(mx>245&&mn>245)continue;        // ignore blanc pur (fond)
          if(mx<12)continue;                 // ignore noir pur
          rS+=rr;gS+=gg;bS+=bb;c++;
        }
        if(!c){cb('#888888');return;}
        const hex='#'+[rS,gS,bS].map(x=>Math.round(x/c).toString(16).padStart(2,'0')).join('');
        cb(hex);
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  };
  inp.click();
}

// Distance couleur + classification vers la famille la plus proche
function hexToRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function colorDist(a,b){ const x=hexToRgb(a),y=hexToRgb(b); return Math.sqrt((x[0]-y[0])**2+(x[1]-y[1])**2+(x[2]-y[2])**2); }
function classifyColor(hex){
  let best=null;
  (userPalette.families||[]).forEach(f=>{
    (f.stops||[]).forEach(st=>{
      const d=colorDist(hex,st);
      if(!best||d<best.dist) best={label:f.label,dist:d,stop:st};
    });
  });
  return best;
}

// localStorage sature vite avec des images -> IndexedDB pour les photos de tenues.
let _db = null;
function openPhotoDB() {
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open('garde-robe-photos', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e);
  });
}
async function savePhoto(outfitId, dataUrl) {
  try {
    const db = await openPhotoDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').put(dataUrl, outfitId);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej();
    });
  } catch (e) { return false; }
}
async function loadPhoto(outfitId) {
  try {
    const db = await openPhotoDB();
    return new Promise((res) => {
      const tx = db.transaction('photos', 'readonly');
      const r = tx.objectStore('photos').get(outfitId);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function deletePhoto(outfitId) {
  try {
    const db = await openPhotoDB();
    return new Promise((res) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').delete(outfitId);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
  } catch (e) { return false; }
}
async function loadAllPhotos() {
  try {
    const db = await openPhotoDB();
    return new Promise((res) => {
      const tx = db.transaction('photos', 'readonly');
      const store = tx.objectStore('photos');
      const out = {};
      const rk = store.getAllKeys(), rv = store.getAll();
      tx.oncomplete = () => {
        (rk.result || []).forEach((k, i) => { out[k] = (rv.result || [])[i]; });
        res(out);
      };
      tx.onerror = () => res({});
    });
  } catch (e) { return {}; }
}

// Compression : max 900px, JPEG 0.72 -> une photo ~80-150 Ko
function compressImage(file, maxSize = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
        else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadWardrobe() {
  try {
    const versionResult = await window.storage.get('wardrobe_version');
    const currentVersion = versionResult && versionResult.value ? versionResult.value : null;

    if (currentVersion !== WARDROBE_VERSION) {
      // === MIGRATION ===
      // Récupère anciens compteurs port et items custom
      let oldWearsMap = {};
      let customItems = [];
      try {
        const oldResult = await window.storage.get('wardrobe');
        if (oldResult && oldResult.value) {
          const oldData = JSON.parse(oldResult.value);
          oldData.forEach(item => {
            if (item.id) oldWearsMap[item.id] = item.wears || 0;
          });
          customItems = oldData.filter(item => item.id && item.id.startsWith('u'));
        }
      } catch (e) {}
      wardrobe = DEFAULT_WARDROBE.map(item => ({
        ...item,
        wears: oldWearsMap[item.id] !== undefined ? oldWearsMap[item.id] : 0
      })).concat(customItems);
      await saveWardrobe();

      // Préserve l'état purchased des items wishlist/skincare existants si déjà stockés
      let oldPurchasedW = {};
      try {
        const oldWL = await window.storage.get('wishlist');
        if (oldWL && oldWL.value) {
          const oldWLData = JSON.parse(oldWL.value);
          oldWLData.forEach(item => {
            if (item.id) oldPurchasedW[item.id] = item.purchased;
          });
        }
      } catch (e) {}
      wishlist = DEFAULT_WISHLIST.map(item => ({
        ...item,
        purchased: oldPurchasedW[item.id] !== undefined ? oldPurchasedW[item.id] : item.purchased
      }));
      // v7.0 : ces pieces sont desormais acquises (marquees achetees meme si coche manuelle absente)
      ['b5', 'b17', 'b30', 'b32'].forEach(bid => { const it = wishlist.find(w => w.id === bid); if (it) it.purchased = true; });
      await saveWishlist();

      let oldPurchasedS = {};
      try {
        const oldSK = await window.storage.get('skincare');
        if (oldSK && oldSK.value) {
          const oldSKData = JSON.parse(oldSK.value);
          oldSKData.forEach(item => {
            if (item.id) oldPurchasedS[item.id] = item.purchased;
          });
        }
      } catch (e) {}
      skincare = DEFAULT_SKINCARE.map(item => ({
        ...item,
        purchased: oldPurchasedS[item.id] !== undefined ? oldPurchasedS[item.id] : item.purchased
      }));
      await saveSkincare();

      await window.storage.set('wardrobe_version', WARDROBE_VERSION);
    } else {
      const result = await window.storage.get('wardrobe');
      if (result && result.value) {
        wardrobe = JSON.parse(result.value);
      } else {
        wardrobe = [...DEFAULT_WARDROBE];
        await saveWardrobe();
      }

      const wlResult = await window.storage.get('wishlist');
      if (wlResult && wlResult.value) {
        wishlist = JSON.parse(wlResult.value);
      } else {
        wishlist = [...DEFAULT_WISHLIST];
        await saveWishlist();
      }

      const skResult = await window.storage.get('skincare');
      if (skResult && skResult.value) {
        skincare = JSON.parse(skResult.value);
      } else {
        skincare = [...DEFAULT_SKINCARE];
        await saveSkincare();
      }
    }
  } catch (e) {
    wardrobe = [...DEFAULT_WARDROBE];
    wishlist = [...DEFAULT_WISHLIST];
    skincare = [...DEFAULT_SKINCARE];
    await saveWardrobe();
    await saveWishlist();
    await saveSkincare();
  }
}

        <path d="M38 37 Q40 33 42 37" stroke="${stroke}" stroke-width="1.2" fill="none"/>
      </svg>`;
    default:
      return `<svg width="${size}" height="${size}" viewBox="0 0 80 80"><rect x="20" y="20" width="40" height="40" rx="4" fill="${c}" stroke="${stroke}" stroke-width="1.2"/></svg>`;
  }
}

// ============ RENDER FUNCTIONS ============
function needsWash(item) {
  const threshold = WASH_THRESHOLDS[item.type] || 999;
  return item.wears >= threshold;
}

function renderWardrobe() {
  const filtered = currentFilter === 'all' ? wardrobe : wardrobe.filter(i => i.category === currentFilter);
  const needWashCount = wardrobe.filter(needsWash).length;

  if (wardrobe.length === 0) {
    return `
    <h2 class="section-title">Mes pièces</h2>
    <div class="ai-box" style="text-align:center">
      <p style="font-size:15px;color:var(--ink);margin-bottom:10px">Ta garde-robe est vide.</p>

      </div>
      <div class="stat">

        <div class="stat-label">À laver</div>
      </div>

    <button class="valise-toggle ${packingMode ? 'on' : ''}" onclick="togglePackingMode()">🧳 ${packingMode ? 'Terminer ma valise' : 'Préparer ma valise'}</button>
    ${packingMode ? `<div class="valise-banner">🧳 <b>${packed.length}</b> pièce${packed.length > 1 ? 's' : ''} dans la valise${packed.length ? ` · <button class="valise-clear" onclick="clearValise()">tout vider</button>` : ''}<div class="valise-hint">Touche les pièces pour les ajouter / retirer. Ensuite, dans l'onglet Aléatoire, active « Ma valise » pour ne tirer que des tenues faisables avec ce que tu emportes.</div></div>` : ''}

    <div class="filters">
      ${['all', 'haut', 'bas', 'surcouche', 'chaussure', 'accessoire'].map(f => `
        <button class="filter-chip ${currentFilter === f ? 'active' : ''}" onclick="setFilter('${f}')">${f === 'all' ? 'Tout' : f}</button>
      `).join('')}
    </div>

    ${(() => {
      const SUBCATS = [
        ['Chemises', ['chemise-lin','chemise-coton']],
        ['Tee-shirts', ['tee']],
        ['Polos', ['polo']],
        ['Maille & sweats', ['maille']],
        ['Pantalons', ['chino','pantalon-lin']],
        ['Shorts', ['short']],
        ['Vestes', ['veste-lin']],
        ['Chaussures', ['sneakers','mocassins']],
        ['Écharpes', ['foulard']],
        ['Ceintures', ['ceinture']],
        ['Montres', ['montre']],
        ['Lunettes', ['lunettes']],
        ['Sacoches', ['sacoche']],
        ['Chapeaux', ['chapeau']],
      ];
      const card = item => `
        <div class="item-card ${needsWash(item) ? 'needs-wash' : ''} ${packingMode && packed.includes(item.id) ? 'packed' : ''}" onclick="${packingMode ? `togglePacked('${item.id}')` : `openItem('${item.id}')`}">

}


let selectedLevels = [];
let selectedVibes = [];
let randomInclude = [];
let randomExclude = [];
let randomPanel = false;
let outfitPieceFilter = null;
let currentRandomOutfit = null;
let outfitOpts = {};

function vibeLabel(v) { return v === 'jeune' ? 'Jeune' : (v === 'mur' ? 'Mûr' : 'Équilibré'); }
function getOpts(o) {
  if (!outfitOpts[o.id]) outfitOpts[o.id] = { scarf: true, short: false, hat: false, strap: o.watch || 'kaki' };
  return outfitOpts[o.id];
}
function findOutfit(id) { return OUTFITS.find(x => x.id === id) || (currentRandomOutfit && currentRandomOutfit.id === id ? currentRandomOutfit : null); }
function toggleOpt(id, k, v) { const o = findOutfit(id); if (!o) return; getOpts(o)[k] = v; render(); }
function setStrap(id, s) { const o = findOutfit(id); if (!o) return; getOpts(o).strap = s; render(); }
const COOL_TOPS = ['sh1','sh2','sh5','t2','t7','t16','t18','p2'];
function outfitScarf(o) {
  if (o.scarf) return o.scarf;
  const top = o.pieces.find(pid => { const p = wardrobe.find(w => w.id === pid); return p && p.category === 'haut'; });
  return COOL_TOPS.includes(top) ? 'a2' : 'a6';
}
function outfitHasShort(o) {
  if (o.shortSwap) return true;
  return o.pieces.some(pid => { const p = wardrobe.find(w => w.id === pid); return p && p.type === 'short'; });
}
function hatVerdict(o) {
  if (o.hat === true) return { ok: true, why: "jour/exterieur — le Panama finit le look (bord large, pile pour ton visage)." };
  if (o.hat === false) return { ok: false, why: "soir/formel en interieur — le chapeau alourdit ; garde-le pour le jour." };
  if (o.level <= 2) return { ok: true, why: "jour/exterieur — le Panama va bien (bord large pour equilibrer ton visage)." };
  return { ok: false, why: "soiree/ceremonie — pas de Panama en interieur habille ; ok seulement en garden-party exterieur." };
}

function outfitCardHTML(o) {
  const op = getOpts(o);
  const watchMap = { kaki: 'a5', acier: 'a9', cuir: 'a10' };
  const watchId = watchMap[op.strap] || 'a5';
  let pids = o.pieces.map(pid => pid === 'a5' ? watchId : pid);
  if (op.short && o.shortSwap) {
    pids = pids.filter(pid => { const p = wardrobe.find(w => w.id === pid); return !(p && p.category === 'bas'); });
    pids.push(o.shortSwap);
  }
  const scarfId = outfitScarf(o);
  if (op.scarf && scarfId && !pids.includes(scarfId)) pids.push(scarfId);
  const hv = hatVerdict(o);
  if (op.hat && hv.ok && !pids.includes('a12')) pids.push('a12');
  const piecesHTML = pids.map(pid => {
    const piece = wardrobe.find(w => w.id === pid);
    if (!piece) return '';
    const name = piece.name, color = piece.color;
    return `<div class="outfit-piece"><div class="piece-swatch" style="background:${color}"></div><span>${name}</span></div>`;
  }).join('');
  let controls = '<div class="opt-row">';
  controls += `<label class="opt-chip"><input type="checkbox" ${op.scarf ? 'checked' : ''} onchange="toggleOpt('${o.id}','scarf',this.checked)"> 🧣 Écharpe</label>`;
  if (outfitHasShort(o)) controls += `<label class="opt-chip"><input type="checkbox" ${op.short ? 'checked' : ''} onchange="toggleOpt('${o.id}','short',this.checked)"> 🩳 Short</label>`;
  if (hv.ok) controls += `<label class="opt-chip"><input type="checkbox" ${op.hat ? 'checked' : ''} onchange="toggleOpt('${o.id}','hat',this.checked)"> 👒 Panama</label>`;
  controls += `<span class="strap-toggle">⌚ <button class="${op.strap === 'kaki' ? 'on' : ''}" onclick="setStrap('${o.id}','kaki')">NATO</button><button class="${op.strap === 'acier' ? 'on' : ''}" onclick="setStrap('${o.id}','acier')">Acier</button><button class="${op.strap === 'cuir' ? 'on' : ''}" onclick="setStrap('${o.id}','cuir')">Cuir</button></span>`;
  controls += '</div>';
  const t = o.tips || {};
  let tips = '<div class="tips">';
  if (t.tuck) tips += `<div><b>Tuck :</b> ${t.tuck}</div>`;
  if (t.buttons) tips += `<div><b>Boutons :</b> ${t.buttons}</div>`;
  if (t.sleeves) tips += `<div><b>Manches :</b> ${t.sleeves}</div>`;
  tips += `<div><b>Écharpe :</b> ${t.scarf || 'boucle lâche, pans inégaux qui pendent — jamais serré'}</div>`;
  const watchName = (wardrobe.find(w => w.id === watchId) || {}).name || 'Montre';
  tips += `<div><b>Montre :</b> ${watchName}${t.strap ? ' — ' + t.strap : ''}</div>`;
  tips += `<div><b>Chapeau :</b> ${hv.ok ? '✓ oui' : '✗ non'} — ${hv.why}</div>`;
  if (t.note) tips += `<div><b>+</b> ${t.note}</div>`;
  tips += '</div>';
  const scarfName = (wardrobe.find(w => w.id === scarfId) || {}).name || '';
  // Photo de la tenue (IndexedDB, cache memoire)
  const photo = photoCache[o.id];
  const photoHTML = photo
    ? `<img class="photo-thumb" src="${photo}" onclick="viewPhoto('${o.id}')" alt="Photo de la tenue">`
    : '';
  const photoActions = o.id === 'libre' ? '' : `<div class="photo-actions">
      <button class="photo-btn" onclick="pickPhoto('${o.id}')">📷 ${photo ? 'Changer la photo' : 'Ajouter une photo'}</button>
      ${photo ? `<button class="photo-btn" onclick="removePhoto('${o.id}')">🗑️</button>` : ''}
      <button class="photo-btn" onclick="wearToday('${o.id}')">✓ Porté aujourd'hui</button>
    </div>`;

  return `<div class="outfit-card">
    <div class="outfit-header"><div class="outfit-name">${o.name}</div><div class="badges"><span class="vibe-badge v-${o.vibe}">${vibeLabel(o.vibe)}</span><span class="outfit-level">niv. ${o.level}</span></div></div>
    ${photoHTML}
    <p style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-style:italic">${o.description}</p>
    <div class="outfit-pieces">${piecesHTML}</div>
    ${controls}
    <p style="font-size:10px;color:var(--ink-faded);font-family:var(--mono);margin:2px 0 0">écharpe → ${scarfName}</p>
    ${photoActions}
    ${tips}
  </div>`;
}

function renderOutfits() {
  const lvlNames = ['Relax', 'Chic décontracté', 'Soirée', 'Cérémonie'];
  const fp = outfitPieceFilter ? (wardrobe.find(w => w.id === outfitPieceFilter) || null) : null;
  const list = fp ? OUTFITS.filter(o => outfitHasPiece(o, outfitPieceFilter)) : OUTFITS;
  let html = `<h2 class="section-title">Tenues</h2>`;

  // Bandeau generation (Claude)
  if (!fp) {
    html += `<div class="gen-panel">`;
    if (genBusy) {
      html += `<div class="ai-spin">${genBusyMsg || 'Génération en cours…'}</div>`;
    } else {
      if (pendingPieces.length > 0) {
        html += `<div class="gen-pending">
          <span>${pendingPieces.length} pièce(s) non traitée(s)</span>
          <button onclick="runIncrementalGen()">Générer leurs tenues</button>
        </div>`;
      }
      html += `<div class="gen-row">
        <span class="gen-count">${generatedOutfits.length} tenue(s) générée(s)</span>
        <button class="gen-btn" onclick="runFullGen()">${generatedOutfits.length ? 'Tout regénérer' : 'Générer mes tenues'}</button>
      </div>`;
    }
    html += `</div>`;
  }

  if (fp) {
    html += `<div class="outfit-banner"><span>👔 ${list.length} tenue(s) avec <b>${fp.name}</b></span><button onclick="clearOutfitPieceFilter()">✕</button></div>`;
  } else {
    html += `<p class="section-subtitle">${OUTFITS.length} compositions · coche écharpe / short, choisis le bracelet</p>`;
  }
  for (let l = 1; l <= 4; l++) {
    const os = list.filter(o => o.level === l);
    if (!os.length) continue;
    html += `<div class="lvl-head">Niveau ${l} · ${lvlNames[l - 1]}</div>`;
    html += os.map(outfitCardHTML).join('');
  }
  return html;
}

function renderRandom() {
  const lvlNames = ['Relax', 'Chic décontracté', 'Soirée', 'Cérémonie'];
  const vibes = [['jeune', 'Jeune'], ['inter', 'Équilibré'], ['mur', 'Mûr']];
  const SUBCATS = [
    ['Chemises', ['chemise-lin','chemise-coton']], ['Tee-shirts', ['tee']], ['Polos', ['polo']],
    ['Maille & sweats', ['maille']], ['Pantalons', ['chino','pantalon-lin']], ['Shorts', ['short']],
    ['Vestes', ['veste-lin']], ['Chaussures', ['sneakers','mocassins']], ['Écharpes', ['foulard']],
    ['Ceintures', ['ceinture']], ['Montres', ['montre']], ['Lunettes', ['lunettes']], ['Chapeaux', ['chapeau']],
  ];
  const nFilters = randomInclude.length + randomExclude.length;
  const panel = randomPanel ? `
    <div class="random-panel">
      <div class="rp-legend">Touche une pièce : 1× = <b>inclure</b> (max 2) · 2× = <b>exclure</b> · 3× = neutre.</div>
      ${SUBCATS.map(([label, types]) => {
        const items = wardrobe.filter(i => types.includes(i.type));
        if (!items.length) return '';
        return `<div class="rp-group">${label}</div><div class="rp-chips">${items.map(i => {
          const st = randomInclude.includes(i.id) ? 'inc' : (randomExclude.includes(i.id) ? 'exc' : '');

        }).join('')}</div>`;
      }).join('')}
    </div>` : '';
  const nameOf = id => (wardrobe.find(w => w.id === id) || {}).name || id;
  const summary = nFilters ? `<div class="rf-summary">${randomInclude.length ? '✓ ' + randomInclude.map(nameOf).join(', ') : ''}${randomInclude.length && randomExclude.length ? ' &nbsp;·&nbsp; ' : ''}${randomExclude.length ? '✕ ' + randomExclude.map(nameOf).join(', ') : ''}</div>` : '';
  const anyFilter = selectedLevels.length || selectedVibes.length || nFilters;
  return `
    <h2 class="section-title">Aléatoire</h2>
    <p class="section-subtitle">filtre autant que tu veux (rien coché = tout) · tire une tenue</p>

    <div class="random-container">

          <button class="level-btn ${selectedLevels.includes(l) ? 'active' : ''}" onclick="toggleLevel(${l})">
            <div class="level-number">${l}</div>
            <div class="level-label">${lvlNames[l-1]}</div>
          </button>
        `).join('')}
      </div>

      </div>

        <button class="valise-random ${shortMode ? 'on' : ''}" onclick="toggleShortMode()">🩳 En short${shortMode ? ' ✓' : ''}</button>
        <button class="valise-random ${randomPanel ? 'on' : ''}" onclick="toggleRandomPanel()">🎛️ Pièces${nFilters ? ' · ' + nFilters : ''}</button>
      </div>
      ${panel}

  const item = wardrobe.find(w => w.id === id);
  if (item) {

    await saveWardrobe();
    render();
    openItem(id);
  }
}

  const item = wardrobe.find(w => w.id === id);
  if (item) {
    item.wears = 0;
    await saveWardrobe();
    render();
    openItem(id);
  }
}

async function deleteItem(id) {
  if (!confirm('Supprimer cette pièce ?')) return;
  wardrobe = wardrobe.filter(w => w.id !== id);
  await saveWardrobe();
  // Retire localement (0 token) les tenues qui utilisaient cette piece
  const removed = pruneOutfitsForRemovedPiece(id);
  if (removed) await saveGenerated();
  pendingPieces = pendingPieces.filter(p => p !== id);
  await savePending();
  // Supprime aussi sa photo
  await deletePhoto('piece-' + id);
  delete photoCache['piece-' + id];
  closeModal();
  render();
  if (removed) setTimeout(() => alert(`Pièce supprimée · ${removed} tenue(s) retirée(s) (sans appel IA).`), 100);
}

// On choisit 1..N photos -> chacune analysée par Claude -> revue/correction -> validation groupée.
let addQueue = [];      // [{ photo, name, brand, color, type, category, note, family, material, tuckable, status }]
let addIndex = 0;       // pièce en cours de revue

const ALL_TYPES = () => Object.keys(WASH_THRESHOLDS);
function categoryOfType(type){
  for (const [cat, types] of Object.entries(CATEGORIES)) if (types.includes(type)) return cat;
  return 'accessoire';
}

function openAddItem() {
  addQueue = [];
  addIndex = 0;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>

    <div class="modal-brand" style="margin-bottom:20px">une ou plusieurs photos, tout est pré-rempli</div>

      📷<br><br>Choisir des photos<br>
      <span style="font-size:11px;color:var(--ink-faded)">une pièce par photo · Claude détecte nom, couleur, type, matière</span>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn" style="width:100%;border:none;background:transparent" onclick="closeModal()">Annuler</button>
    </div>`;
  document.getElementById('modalBackdrop').classList.add('show');

// Sélection multiple + compression + analyse en série
function pickAddPhotos() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async () => {
    const files = Array.from(inp.files || []);
    if (!files.length) return;
    // 1) compresser toutes les photos
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-handle"></div>
      <div class="modal-name">Analyse…</div>
      <div class="ai-spin" id="add-progress">Préparation de ${files.length} photo(s)…</div>`;
    addQueue = [];
    for (const f of files) {
      try {
        const photo = await compressImage(f, 900, 0.75);
        addQueue.push({ photo, name:'', brand:'', color:'#a37c4c', type: ALL_TYPES()[0],
          category:'accessoire', note:'', family:undefined, material:undefined, tuckable:undefined, status:'pending' });
      } catch(e){}
    }
    // 2) analyser chaque photo en série (avec progression)
    for (let i=0;i<addQueue.length;i++){
      const prog = document.getElementById('add-progress');
      if (prog) prog.textContent = `Analyse ${i+1} / ${addQueue.length}…`;
      await analyzeQueueItem(i);
    }
    // 3) revue de la première pièce
    addIndex = 0;
    renderAddReview();
  };
  inp.click();
}

async function analyzeQueueItem(i){
  const it = addQueue[i];
  try {
    const out = await callClaude('analyze', { image: it.photo.split(',')[1], mediaType:'image/jpeg', text:'Analyse cette pièce.' });
    const d = parseJSONLoose(out);
    if (d){
      it.name = d.name || '';
      it.color = d.color || it.color;
      it.type = (d.type && ALL_TYPES().includes(d.type)) ? d.type : it.type;
      it.category = d.category || categoryOfType(it.type);
      it.note = d.note || '';
      it.family = d.family;
      it.material = d.material;
      it.tuckable = d.tuckable;
      it.inPalette = d.inPalette;
      it.faceOk = d.faceOk;
      it.status = 'ok';
    } else { it.status = 'error'; }
  } catch(e){ it.status = 'error'; it.errMsg = e.message; }
}

// Revue / correction d'une pièce de la file
function renderAddReview(){
  const n = addQueue.length;
  const it = addQueue[addIndex];
  const typeOpts = ALL_TYPES().map(t => `<option value="${t}"${t===it.type?' selected':''}>${t}</option>`).join('');
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-name">Pièce ${addIndex+1} / ${n}</div>
    <div class="modal-brand" style="margin-bottom:14px">${it.status==='error' ? '⚠️ analyse échouée — remplis à la main' : 'vérifie et corrige'}</div>

    <img class="ai-preview" src="${it.photo}" alt="pièce">

    <div class="form-group"><label class="form-label">Nom</label>
      <input class="form-input" id="rv-name" value="${escAttr(it.name)}" placeholder="Ex : Chemise lin écru"></div>

    <div class="form-group"><label class="form-label">Couleur</label>
      <div class="color-picker-row">
        <input type="color" id="rv-color" value="${it.color}">
        <input class="form-input" id="rv-color-text" value="${it.color}">
      </div></div>

    <div class="form-group"><label class="form-label">Type</label>
      <select class="form-select" id="rv-type">${typeOpts}</select></div>

    <div class="form-group"><label class="form-label">Marque</label>
      <input class="form-input" id="rv-brand" value="${escAttr(it.brand)}" placeholder="Ex : Polo RL"></div>

    <div class="form-group"><label class="form-label">Note (optionnel)</label>
      <input class="form-input" id="rv-note" value="${escAttr(it.note)}" placeholder="détails, contexte..."></div>

    ${it.inPalette===false ? '<p class="prof-hint" style="color:var(--alert)">Hors palette selon ton profil.</p>' : ''}

    <div class="actions">
      ${addIndex>0 ? '<button class="btn" onclick="addReviewNav(-1)">Précédent</button>' : '<button class="btn" onclick="closeModal()">Annuler</button>'}
      ${addIndex < n-1
        ? '<button class="btn primary" onclick="addReviewNav(1)">Suivant</button>'
        : '<button class="btn primary" onclick="commitAddQueue()">Tout ajouter</button>'}
    </div>
    <p style="font-size:11px;color:var(--ink-faded);text-align:center;margin-top:10px">${n} pièce(s) — ajoutées ensemble à la fin</p>`;

  document.getElementById('rv-color').addEventListener('input', e => document.getElementById('rv-color-text').value = e.target.value);
  document.getElementById('rv-color-text').addEventListener('input', e => document.getElementById('rv-color').value = e.target.value);
}

// Sauvegarde les champs édités de la pièce courante
function stashAddReview(){
  const it = addQueue[addIndex];
  if (!it) return;
  it.name = document.getElementById('rv-name').value.trim();
  it.color = document.getElementById('rv-color').value;
  it.type = document.getElementById('rv-type').value;
  it.category = categoryOfType(it.type);
  it.brand = document.getElementById('rv-brand').value.trim();
  it.note = document.getElementById('rv-note').value.trim();
}

function addReviewNav(dir){
  stashAddReview();
  addIndex = Math.max(0, Math.min(addQueue.length-1, addIndex + dir));
  renderAddReview();
}

// Valide toute la file d'un coup — SANS générer les tenues (ça se fait depuis l'onglet Tenues)
async function commitAddQueue(){
  stashAddReview();
  let added = 0;
  for (const it of addQueue){
    if (!it.name) it.name = it.type;   // filet de sécurité
    const id = 'u' + Date.now() + '-' + added;
    const item = {
      id, name: it.name, brand: it.brand || '—', color: it.color,
      type: it.type, category: it.category, wears: 0,
      note: it.note || undefined, family: it.family || undefined,
      material: it.material || undefined,
      tuckable: (it.tuckable !== undefined) ? it.tuckable : (it.type==='chino'||it.type==='pantalon-lin')
    };
    wardrobe.push(item);
    if (it.photo){ await savePhoto('piece-'+id, it.photo); photoCache['piece-'+id] = it.photo; }
    if (['haut','bas','surcouche','chaussure'].includes(item.category) && !pendingPieces.includes(id)) pendingPieces.push(id);
    added++;
  }
  await saveWardrobe();
  await savePending();
  addQueue = []; addIndex = 0;
  closeModal();
  render();
  alert(`✓ ${added} pièce(s) ajoutée(s).\\n\\nVa dans l'onglet Tenues pour composer les tenues quand tu veux.`);
}

let genBusy = false;
