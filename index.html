<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garde-robe</title>
<meta name="description" content="Garde-robe digitale — old money mediterranean">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garde-robe">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f5f1ea;
    --bg-card: #fdfaf4;
    --ink: #2a2419;
    --ink-soft: #6b5d4a;
    --ink-faded: #a89880;
    --accent: #8b5a2b;
    --accent-soft: #c89968;
    --line: #d9cdb8;
    --line-soft: #ebe2cd;
    --alert: #c44d2c;
    --success: #6b8e4e;
    --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
    --sans: 'Inter Tight', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap');

  /* ===== HEADER ===== */
  .app-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }

  .brand {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-style: italic;
  }

  .date {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-faded);
  }

  .tagline {
    font-family: var(--serif);
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
    letter-spacing: 0.05em;
  }

  /* ===== NAV ===== */
  .nav {
    display: flex;
    gap: 0;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-card);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 87px;
    z-index: 49;
  }
  .nav::-webkit-scrollbar { display: none; }

  .nav-item {
    flex-shrink: 0;
    padding: 8px 14px;
    margin-right: 4px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .nav-item.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .nav-item:not(.active):hover {
    border-color: var(--line);
  }

  /* ===== MAIN ===== */
  main {
    padding: 24px 20px 100px;
    max-width: 600px;
    margin: 0 auto;
  }

  .section-title {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .section-subtitle {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faded);
    margin-bottom: 20px;
  }

  /* ===== FILTERS ===== */
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-chip {
    padding: 6px 12px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--ink-soft);
  }

  .filter-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* ===== VALISE / PACKING ===== */
  .valise-toggle {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    border: 1px solid var(--line); background: var(--bg-card); color: var(--ink-soft);
    padding: 8px 15px; border-radius: 100px; cursor: pointer; transition: all 0.2s;
    margin: 0 0 12px;
  }
  .valise-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .valise-banner {
    background: var(--bg-card); border: 1px dashed var(--accent-soft); border-radius: 8px;
    padding: 11px 14px; margin: 0 0 14px; font-size: 13px; color: var(--ink-soft);
  }
  .valise-banner b { color: var(--accent); font-size: 16px; }
  .valise-clear {
    background: none; border: none; color: var(--alert); font-size: 12px; cursor: pointer;
    text-decoration: underline; padding: 0; font-family: var(--sans);
  }
  .valise-hint { font-size: 11px; color: var(--ink-faded); font-style: italic; margin-top: 6px; line-height: 1.4; }
  .item-card.packed { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: #fbf4ea; }
  .pack-check {
    position: absolute; top: 6px; left: 6px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--accent); background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 700;
  }
  .item-card.packed .pack-check { background: var(--accent); }
  .valise-random {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    border: 1px solid var(--line); background: var(--bg-card); color: var(--ink-soft);
    padding: 7px 15px; border-radius: 100px; cursor: pointer; margin: 0 0 6px;
  }
  .valise-random.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .valise-count { font-size: 13px; color: var(--ink-faded); font-style: italic; font-family: var(--serif); margin: 0 0 14px; text-align: center; }

  /* ===== GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .item-card {
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }

  .item-card:hover {
    border-color: var(--accent-soft);
    transform: translateY(-2px);
  }

  .item-card.needs-wash::after {
    content: '';
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    background: var(--alert);
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--bg-card);
  }

  .item-illustration {
    aspect-ratio: 1;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .item-info {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--line-soft);
  }

  .item-name {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
    line-height: 1.2;
  }

  .item-meta {
    font-family: var(--mono);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-faded);
  }

  .item-stats {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-soft);
  }

  .wear-count {
    font-family: var(--mono);
  }

  /* ===== ITEM MODAL ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(42, 36, 25, 0.6);
    z-index: 100;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    background: var(--bg);
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-illustration {
    aspect-ratio: 1.4;
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    margin-bottom: 20px;
  }

  .modal-name {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .modal-brand {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faded);
    margin-bottom: 20px;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13px;
  }

  .detail-label {
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 24px;
  }

  .btn {
    padding: 14px 16px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--ink);
    background: var(--bg);
    color: var(--ink);
    transition: all 0.2s;
    flex: 1;
  }

  .btn.primary {
    background: var(--ink);
    color: var(--bg);
  }

  .btn.wash {
    background: var(--success);
    color: white;
    border-color: var(--success);
  }

  .btn.danger {
    background: transparent;
    color: var(--alert);
    border-color: var(--alert);
  }

  .btn:hover { opacity: 0.85; }

  /* ===== PALETTE ===== */
  .palette-section {
    margin-bottom: 32px;
  }

  .palette-header {
    font-family: var(--serif);
    font-size: 18px;
    font-style: italic;
    margin-bottom: 12px;
    color: var(--ink);
  }

  .palette-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .color-chip {
    aspect-ratio: 1;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    border: 1px solid var(--line-soft);
  }

  .color-chip span {
    position: absolute;
    bottom: -18px;
    left: 0;
    right: 0;
    font-size: 9px;
    text-align: center;
    color: var(--ink-soft);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .matter-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }

  .matter-card {
    padding: 14px;
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
  }

  .matter-name {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .matter-desc {
    font-size: 11px;
    color: var(--ink-soft);
  }

  /* ===== TENUES ===== */
  .outfit-card {
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .outfit-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }

  .outfit-name {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
    font-style: italic;
  }

  .outfit-level {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: var(--bg);
    padding: 4px 10px;
    border-radius: 100px;
    border: 1px solid var(--accent-soft);
  }

  .outfit-pieces {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .outfit-piece {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding: 6px 3px;
    background: var(--bg);
    border-radius: 4px;
    font-size: 9px;
    line-height: 1.2;
  }

  .piece-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }

  .subcat-head {
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 24px 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .subcat-head:first-of-type { margin-top: 8px; }

  .random-panel {
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
    max-height: 300px;
    overflow-y: auto;
  }
  .rp-legend { font-size: 11px; color: var(--ink-soft); margin-bottom: 10px; }
  .rp-group { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faded); margin: 12px 0 6px; }
  .rp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .rp-chip {
    font-size: 11px; padding: 5px 9px; border-radius: 100px;
    border: 1px solid var(--line); background: var(--bg-card);
    color: var(--ink-soft); cursor: pointer;
  }
  .rp-chip.inc { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .rp-chip.exc { border-color: var(--alert); color: var(--alert); text-decoration: line-through; opacity: .8; }
  .rf-summary { font-size: 12px; color: var(--ink-soft); margin: 8px 0; text-align: center; }
  .rf-reset {
    font-size: 11px; background: transparent; border: 1px solid var(--line);
    border-radius: 100px; padding: 4px 12px; cursor: pointer; color: var(--ink-soft);
  }
  .ai-box {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .ai-drop {
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 30px 18px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    cursor: pointer;
    background: var(--bg);
  }
  .ai-drop:active { background: var(--line-soft); }
  .ai-preview { width: 100%; border-radius: 8px; margin-bottom: 12px; display: block; }
  .ai-result {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    border-left: 3px solid var(--accent-soft);
    border-radius: 6px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .ai-spin { text-align: center; padding: 22px; color: var(--ink-soft); font-size: 13px; }
  .verdict {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 10px;
  }
  .v-ok   { background: var(--success); color: #fff; }
  .v-adj  { background: var(--accent-soft); color: var(--ink); }
  .v-no   { background: var(--alert); color: #fff; }
  .gen-panel { margin-bottom: 16px; }
  .gen-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .gen-count { font-size: 12px; color: var(--ink-soft); }
  .gen-btn {
    background: var(--ink); color: var(--bg-card); border: none;
    border-radius: 100px; padding: 8px 16px; font-size: 12px; font-weight: 600;
    font-family: var(--sans); cursor: pointer; white-space: nowrap;
  }
  .gen-pending {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  }
  .gen-pending span { font-size: 12px; color: var(--ink); }
  .gen-pending button {
    background: var(--ink); color: var(--bg-card); border: none;
    border-radius: 100px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .gen-badge {
    font-size: 9px;
    background: var(--line-soft);
    color: var(--ink-soft);
    border-radius: 100px;
    padding: 2px 8px;
    font-family: var(--mono);
  }
  .field-ai {
    font-size: 11px;
    color: var(--accent);
    font-family: var(--mono);
    margin-top: 4px;
  }

  .update-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--ink);
    color: var(--bg-card);
    padding: 10px 16px;
    font-size: 13px;
    font-family: var(--sans);
    position: sticky;
    top: 0;
    z-index: 200;
  }
  .update-banner.show { display: flex; }
  .update-banner button {
    background: var(--accent-soft);
    color: var(--ink);
    border: none;
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .photo-thumb {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    display: block;
    cursor: pointer;
    border: 1px solid var(--line);
  }
  .photo-actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .photo-btn {
    flex: 1;
    font-size: 11px;
    padding: 7px 10px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-soft);
    cursor: pointer;
    font-family: var(--sans);
  }

  .log-entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .log-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faded);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .log-name { font-size: 14px; color: var(--ink); font-weight: 500; }
  .log-del {
    background: transparent;
    border: none;
    color: var(--ink-faded);
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .log-stat {
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink);
  }
  .data-btn {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--bg-card);
    color: var(--ink);
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
  }

  .outfit-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--accent-soft); border: 1px solid var(--accent-soft);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
  }
  .outfit-banner button { background: transparent; border: none; font-size: 16px; cursor: pointer; color: var(--ink-soft); }

  /* ===== RANDOM ===== */
  .random-container {
    text-align: center;
    padding: 20px 0;
  }

  .level-selector {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 28px;
  }

  .level-btn {
    aspect-ratio: 1;
    border: 1px solid var(--line);
    background: var(--bg-card);
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.2s;
  }

  .level-btn.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .level-number {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    line-height: 1;
  }

  .level-label {
    font-family: var(--mono);
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .random-result {

<script>
// ============ MOTEUR DE TENUES (100% LOCAL, ZERO TOKEN) ============
// Familles couleur : wl=clair chaud, wd=chaud profond, ol=olive,
// co=marine/froid, cl=chambray/bleu clair, ac=accent, nk=noir/anthracite
const FAMILY_OF = {
  t1:'wl', t5:'wl', t9:'wl', p1:'wl', p3:'wl', m2:'wl', sh4:'wl', pn1:'wl', pn3:'wl', s2:'wl', s4:'wl',
  t4:'wd', t15:'wd', t17:'wd', sh6:'wd', m1:'wd', pn4:'wd', pn7:'wd',
  t3:'ol', sh3:'ol', pn5:'ol', pn8:'ol', s5:'ol',
  t7:'co', t16:'co', t18:'co', p2:'co', sh1:'co', sh2:'co', pn2:'co', pn6:'co', pn9:'co', s1:'co',
  t2:'cl', sh5:'cl',
  t14:'ac', t8:'ac', s3:'ac',
  t10:'nk', t11:'nk', t12:'nk', t13:'nk'
};

// Bas a passants (tuck possible + ceinture). Le reste = cordon elastique.
const TUCKABLE = ['pn1','pn2','pn3','pn4','pn5','pn8','s5'];

// Estime la famille d'une couleur hex si la piece n'en a pas
function guessFamily(hex) {
  if (!hex || hex[0] !== '#') return 'wl';
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const sat = Math.max(r,g,b) - Math.min(r,g,b);
  const lum = r*0.299 + g*0.587 + b*0.114;
  // Bleus AVANT le test sombre : un marine fonce reste du marine, pas du noir
  if (b > r + 20 && b >= g) return lum > 140 ? 'cl' : 'co';
  if (g >= r && g > b + 12) return 'ol';                    // verts / olive
  if (r > g + 50 && r > b + 50) return 'ac';                // terracotta / rouille
  if (sat < 22 && lum < 90) return 'nk';                    // vrai noir/anthracite : desature ET sombre
  if (lum > 165) return 'wl';                               // clairs chauds
  return 'wd';                                              // chauds profonds (dont chocolat tres fonce)
}
function famOf(item) {
  if (!item) return 'wl';
  return item.family || FAMILY_OF[item.id] || guessFamily(item.color);
}
function tuckableOf(item) {
  if (!item) return false;
  if (item.tuckable !== undefined) return item.tuckable;
  return TUCKABLE.includes(item.id);
}

// Regles d'accord haut (au visage) / bas
function compat(tf, bf) {
  if (tf === 'wl') return true;                                  // clair chaud va avec tout
  if (tf === 'wd') return ['wl','wd','ol','co'].includes(bf);
  if (tf === 'ol') return ['wl','wd','co'].includes(bf);         // jamais olive+olive
  if (tf === 'co') return ['wl','wd','ol','ac'].includes(bf);    // jamais marine+marine
  if (tf === 'cl') return ['wl','wd','ol','co'].includes(bf);
  if (tf === 'ac') return ['wl','wd','ol','co'].includes(bf);    // accent jamais double
  if (tf === 'nk') return ['wl','wd','ol','co'].includes(bf);    // noir = layer only
  return false;
}

// Echarpe : froid au visage -> tabac ; fonce/chaud -> creme ; clair -> tabac
function scarfFor(tf) {
  if (tf === 'co' || tf === 'cl') return 'a2';  // tabac rechauffe
  if (tf === 'wd' || tf === 'nk') return 'a6';  // creme eclaire
  return 'a2';                                   // clair -> tabac pour la profondeur
}

function watchFor(level, vibe) {
  if (level >= 3) return 'cuir';
  if (level === 2) return vibe === 'mur' ? 'cuir' : 'acier';
  return 'kaki';
}

const TYPE_LEVEL = {
  'tee': 1, 'polo': 1, 'maille': 1,
  'chemise-lin': 2, 'chemise-coton': 2,
  'veste-lin': 3
};

function tuckTip(bas, topType) {
  if (!tuckableOf(bas)) return "Rien rentre (taille a cordon), pas de ceinture.";
  if (topType && topType.startsWith('chemise')) return "Chemise rentree, ou demi-tuck + ceinture cognac.";
  return "Front-tuck leger + ceinture cognac.";
}
function sleeveTip(topType) {
  if (topType && topType.startsWith('chemise')) return "Rouleau italien 2-3 plis, sous le coude.";
  if (topType === 'maille') return "Maille telle quelle, on n'y touche pas.";
  if (topType === 'polo') return "Manches telles quelles.";
  return "Tee retrousse 1 pli sur l'avant-bras.";
}
function harmonyNote(tf, bf, shoeName) {
  let base;
  if (tf === 'co' || tf === 'cl') base = "Haut froid au visage : l'echarpe tabac et le bas chaud le rechauffent.";
  else if (tf === 'nk') base = "Le fonce n'est jamais seul au visage : garde une couche chaude ouverte par-dessus.";
  else if (tf === 'ac') base = "Le terracotta est ton seul accent : tout le reste reste neutre.";
  else if (bf === 'co') base = "Le bas marine ancre l'ensemble, le chaud reste pres du teint.";
  else base = "Camaieu chaud coherent — un point clair (echarpe ou chaussure) apporte la lumiere.";
  return base + (shoeName ? ' ' + shoeName + ' aux pieds.' : '');
}

// Signature d'une tenue, pour ne pas generer de doublon
function outfitSig(pieces) {
  const h = pieces.filter(p => { const w = wardrobe.find(x => x.id === p); return w && w.category === 'haut'; }).sort();
  const b = pieces.find(p => { const w = wardrobe.find(x => x.id === p); return w && w.category === 'bas'; });
  const c = pieces.find(p => { const w = wardrobe.find(x => x.id === p); return w && w.category === 'chaussure'; });
  return h.join('|') + '#' + (b || '') + '#' + (c || '');
}

// ============ VALIDATION LOCALE (garde-fou, 0 token) ============
// Verifie qu'une tenue renvoyee par Claude ne casse aucune regle dure.
// Si Claude se trompe, on filtre AVANT d'enregistrer.
function outfitFaults(o) {
  const faults = [];
  const get = id => wardrobe.find(w => w.id === id);
  const pieces = (o.pieces || []).map(get).filter(Boolean);
  if (pieces.length !== (o.pieces || []).length) faults.push('piece inconnue');

  const hauts = pieces.filter(p => p.category === 'haut');
  const bas = pieces.find(p => p.category === 'bas');
  if (!hauts.length) faults.push('pas de haut');
  if (!bas) faults.push('pas de bas');

  // la piece au visage = le dernier haut liste (chemise/veste ouverte apres tee)
  const face = hauts.length ? hauts[hauts.length - 1] : null;
  const tf = face ? famOf(face) : null;
  const bf = bas ? famOf(bas) : null;

  if (tf === 'ol' && bf === 'ol') faults.push('olive+olive');
  if (tf === 'co' && bf === 'co') faults.push('marine+marine au visage');
  if (pieces.filter(p => famOf(p) === 'ac').length >= 2) faults.push('double accent');

  // noir seul au visage : autorise seulement si une chemise/veste ouverte le couvre
  const hasCover = pieces.some(p => p.category === 'surcouche' || (p.category === 'haut' && p.type && p.type.startsWith('chemise')));
  if (tf === 'nk' && hauts.length < 2 && !hasCover) faults.push('noir seul au visage');

  // ceinture sur cordon
  if (o.pieces && o.pieces.includes('a3') && bas && !tuckableOf(bas)) faults.push('ceinture sur cordon');

  return faults;
}

// Normalise une tenue Claude -> format interne + id stable
function normalizeOutfit(o, idx) {
  return {
    id: 'ai-' + Date.now().toString(36) + '-' + idx,
    generated: true,
    name: o.name || 'Tenue',
    level: [1,2,3,4].includes(o.level) ? o.level : 1,
    vibe: ['jeune','inter','mur'].includes(o.vibe) ? o.vibe : 'inter',
    description: o.description || '',
    pieces: Array.isArray(o.pieces) ? o.pieces : [],
    scarf: o.scarf || null,
    shortSwap: null,
    watch: ['kaki','acier','cuir'].includes(o.watch) ? o.watch : 'kaki',
    hat: o.hat !== false,
    tips: {
      tuck: (o.tips && o.tips.tuck) || '',
      sleeves: (o.tips && o.tips.sleeves) || '',
      scarf: (o.tips && o.tips.scarf) || '',
      note: (o.tips && o.tips.note) || ''
    }
  };
}

// Payload garde-robe envoye a Claude (compact, pour limiter les tokens)
function wardrobePayload() {
  return wardrobe.map(w => ({
    id: w.id, nom: w.name, type: w.type,
    couleur: w.color, matiere: w.material || '',
    famille: famOf(w), passants: tuckableOf(w)
  }));
}

// ---- GENERATION COMPLETE (gros appel, rare) ----
async function generateAllOutfits() {
  const payload = wardrobePayload();
  const text = "Voici ma garde-robe complete (JSON). Compose le maximum de tenues excellentes et variees.\n\n" + JSON.stringify(payload);
  const raw = await callClaude('generate', { text });
  const data = parseJSONLoose(raw);
  if (!data || !Array.isArray(data.outfits)) throw new Error('Reponse de generation illisible');

  const kept = [], dropped = [];
  data.outfits.forEach((o, i) => {
    const n = normalizeOutfit(o, i);
    const f = outfitFaults(n);
    if (f.length === 0) kept.push(n); else dropped.push({ name: n.name, f });
  });

  generatedOutfits = kept;
  await saveGenerated();
  rebuildCatalog();
  return { kept: kept.length, dropped: dropped.length };
}

// ---- GENERATION INCREMENTALE (petit appel, a l'ajout de pieces) ----
async function generateForNewPieces(newIds) {
  const payload = wardrobePayload();
  const text = "Voici ma garde-robe complete (JSON). Je viens d'ajouter ces nouvelles pieces : "
    + JSON.stringify(newIds)
    + ". Compose UNIQUEMENT les nouvelles tenues qui utilisent au moins une de ces pieces.\n\n"
    + JSON.stringify(payload);
  const raw = await callClaude('generate_incremental', { text });
  const data = parseJSONLoose(raw);
  if (!data || !Array.isArray(data.outfits)) throw new Error('Reponse illisible');

  let added = 0;
  data.outfits.forEach((o, i) => {
    const n = normalizeOutfit(o, generatedOutfits.length + i);
    // ne garde que si ca utilise vraiment une nouvelle piece ET zero faute
    if (!n.pieces.some(p => newIds.includes(p))) return;
    if (outfitFaults(n).length) return;
    generatedOutfits.push(n);
    added++;
  });
  await saveGenerated();
  rebuildCatalog();
  return added;
}

// Reconstruit OUTFITS = curatees + generees (0 token)
function rebuildCatalog() {
  OUTFITS = CURATED_OUTFITS.concat(generatedOutfits);
  generatedCount = generatedOutfits.length;
}

// Suppression d'une piece -> retire localement ses tenues (0 token)
function pruneOutfitsForRemovedPiece(pieceId) {
  const before = generatedOutfits.length;
  generatedOutfits = generatedOutfits.filter(o => !o.pieces.includes(pieceId));
  const removed = before - generatedOutfits.length;
  if (removed) { rebuildCatalog(); }
  return removed;
}

async function saveGenerated() {
  await window.storage.set('generated', JSON.stringify(generatedOutfits));
}
async function loadGenerated() {
  try {
    const r = await window.storage.get('generated');
    generatedOutfits = r && r.value ? JSON.parse(r.value) : [];
  } catch (e) { generatedOutfits = []; }
  rebuildCatalog();
}

// File d'attente des pieces ajoutees non encore generees (regroupement)
let pendingPieces = [];
async function savePending() { await window.storage.set('pending', JSON.stringify(pendingPieces)); }
async function loadPending() {
  try { const r = await window.storage.get('pending'); pendingPieces = r && r.value ? JSON.parse(r.value) : []; }
  catch (e) { pendingPieces = []; }
}

// ---- ancienne generation locale conservee en secours (jamais appelee par defaut) ----
function generateOutfits_LOCAL() {
  const hauts = wardrobe.filter(w => w.category === 'haut');
  const bas = wardrobe.filter(w => w.category === 'bas');
  const chaussures = wardrobe.filter(w => w.category === 'chaussure');
  const ceintureCognac = wardrobe.find(w => w.id === 'a3') ? 'a3' : null;
  if (!hauts.length || !bas.length || !chaussures.length) return [];

  // Signatures deja couvertes par les tenues curatees
  const seen = new Set(CURATED_OUTFITS.map(o => outfitSig(o.pieces)));
  const out = [];
  const shoeUse = {};
  chaussures.forEach(c => shoeUse[c.id] = 0);
  let n = 0;

  hauts.forEach(top => {
    const tf = famOf(top);
    // Le noir/anthracite ne se porte pas seul au visage -> exclu du generateur simple
    if (tf === 'nk') return;

    const basOk = bas.filter(b => compat(tf, famOf(b)));
    // Max 3 bas par haut pour eviter l'explosion combinatoire
    basOk.slice(0, 3).forEach(b => {
      // chaussure la moins utilisee d'abord (repartition equilibree)
      const sorted = chaussures.slice().sort((x, y) => shoeUse[x.id] - shoeUse[y.id]);
      const shoe = sorted[0];
      shoeUse[shoe.id]++;

      const belt = (tuckableOf(b) && ceintureCognac) ? [ceintureCognac] : [];
      const pieces = [top.id, b.id, ...belt, shoe.id, 'a5'];
      const sig = outfitSig(pieces);
      if (seen.has(sig)) return;
      seen.add(sig);

      const level = TYPE_LEVEL[top.type] || 1;
      const bf = famOf(b);
      const vibe = level >= 2 ? (tf === 'wd' || tf === 'ol' ? 'mur' : 'inter')
                              : (tf === 'co' || tf === 'cl' ? 'inter' : 'jeune');
      n++;
      out.push({
        id: 'gen-' + n,
        generated: true,
        name: `${top.name} + ${b.name}`,
        level,
        vibe,
        description: `${top.name} + ${b.name} + ${shoe.name}.`,
        pieces,
        scarf: scarfFor(tf),
        shortSwap: null,
        watch: watchFor(level, vibe),
        hat: level <= 2,
        tips: {
          tuck: tuckTip(b, top.type),
          sleeves: sleeveTip(top.type),
          scarf: scarfFor(tf) === 'a2' ? "Tabac." : "Creme.",
          note: harmonyNote(tf, bf, shoe.name)
        }
      });
    });
  });

  return out;
}

// ============ CLIENT API (via /api/claude sur Vercel) ============
// La cle API n'est jamais dans le navigateur : elle vit sur le serveur Vercel.
const API_URL = '/api/claude';

async function callClaude(task, { image, mediaType, text } = {}) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task, image, mediaType, text })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erreur ' + r.status);
  return d.result;
}

// Extrait le JSON d'une reponse (au cas ou le modele ajoute du texte autour)
function parseJSONLoose(txt) {
  if (!txt) return null;
  let t = txt.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a !== -1 && b !== -1) t = t.slice(a, b + 1);
  try { return JSON.parse(t); } catch (e) { return null; }
}

// ============ PHOTOS : IndexedDB ============
// localStorage sature vite avec des images -> IndexedDB pour les photos de tenues.
let _db = null;
function openPhotoDB() {
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open('garde-robe-photos', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e);
  });
}
async function savePhoto(outfitId, dataUrl) {
  try {
    const db = await openPhotoDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').put(dataUrl, outfitId);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej();
    });
  } catch (e) { return false; }
}
async function loadPhoto(outfitId) {
  try {
    const db = await openPhotoDB();
    return new Promise((res) => {
      const tx = db.transaction('photos', 'readonly');
      const r = tx.objectStore('photos').get(outfitId);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function deletePhoto(outfitId) {
  try {
    const db = await openPhotoDB();
    return new Promise((res) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').delete(outfitId);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);
    });
  } catch (e) { return false; }
}
async function loadAllPhotos() {
  try {
    const db = await openPhotoDB();
    return new Promise((res) => {
      const tx = db.transaction('photos', 'readonly');
      const store = tx.objectStore('photos');
      const out = {};
      const rk = store.getAllKeys(), rv = store.getAll();
      tx.oncomplete = () => {
        (rk.result || []).forEach((k, i) => { out[k] = (rv.result || [])[i]; });
        res(out);
      };
      tx.onerror = () => res({});
    });
  } catch (e) { return {}; }
}

// Compression : max 900px, JPEG 0.72 -> une photo ~80-150 Ko
function compressImage(file, maxSize = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > h && w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; }
        else if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadWardrobe() {
  try {
    const versionResult = await window.storage.get('wardrobe_version');
    const currentVersion = versionResult && versionResult.value ? versionResult.value : null;

    if (currentVersion !== WARDROBE_VERSION) {
      // === MIGRATION ===
      // Récupère anciens compteurs port et items custom
      let oldWearsMap = {};
      let customItems = [];
      try {
        const oldResult = await window.storage.get('wardrobe');
        if (oldResult && oldResult.value) {
          const oldData = JSON.parse(oldResult.value);
          oldData.forEach(item => {
            if (item.id) oldWearsMap[item.id] = item.wears || 0;
          });
          customItems = oldData.filter(item => item.id && item.id.startsWith('u'));
        }
      } catch (e) {}
      wardrobe = DEFAULT_WARDROBE.map(item => ({
        ...item,
        wears: oldWearsMap[item.id] !== undefined ? oldWearsMap[item.id] : 0
      })).concat(customItems);
      await saveWardrobe();

      // Préserve l'état purchased des items wishlist/skincare existants si déjà stockés
      let oldPurchasedW = {};
      try {
        const oldWL = await window.storage.get('wishlist');
        if (oldWL && oldWL.value) {
          const oldWLData = JSON.parse(oldWL.value);
          oldWLData.forEach(item => {
            if (item.id) oldPurchasedW[item.id] = item.purchased;
          });
        }
      } catch (e) {}
      wishlist = DEFAULT_WISHLIST.map(item => ({
        ...item,
        purchased: oldPurchasedW[item.id] !== undefined ? oldPurchasedW[item.id] : item.purchased
      }));
      // v7.0 : ces pieces sont desormais acquises (marquees achetees meme si coche manuelle absente)
      ['b5', 'b17', 'b30', 'b32'].forEach(bid => { const it = wishlist.find(w => w.id === bid); if (it) it.purchased = true; });
      await saveWishlist();

      let oldPurchasedS = {};
      try {
        const oldSK = await window.storage.get('skincare');
        if (oldSK && oldSK.value) {
          const oldSKData = JSON.parse(oldSK.value);
          oldSKData.forEach(item => {
            if (item.id) oldPurchasedS[item.id] = item.purchased;
          });
        }
      } catch (e) {}
      skincare = DEFAULT_SKINCARE.map(item => ({
        ...item,
        purchased: oldPurchasedS[item.id] !== undefined ? oldPurchasedS[item.id] : item.purchased
      }));
      await saveSkincare();

      await window.storage.set('wardrobe_version', WARDROBE_VERSION);
    } else {
      const result = await window.storage.get('wardrobe');
      if (result && result.value) {
        wardrobe = JSON.parse(result.value);
      } else {
        wardrobe = [...DEFAULT_WARDROBE];
        await saveWardrobe();
      }

      const wlResult = await window.storage.get('wishlist');
      if (wlResult && wlResult.value) {
        wishlist = JSON.parse(wlResult.value);
      } else {
        wishlist = [...DEFAULT_WISHLIST];
        await saveWishlist();
      }

      const skResult = await window.storage.get('skincare');
      if (skResult && skResult.value) {
        skincare = JSON.parse(skResult.value);
      } else {
        skincare = [...DEFAULT_SKINCARE];
        await saveSkincare();
      }
    }
  } catch (e) {
    wardrobe = [...DEFAULT_WARDROBE];
    wishlist = [...DEFAULT_WISHLIST];
    skincare = [...DEFAULT_SKINCARE];
    await saveWardrobe();
    await saveWishlist();
    await saveSkincare();
  }
}

async function saveWardrobe() {
  try {
    await window.storage.set('wardrobe', JSON.stringify(wardrobe));
  } catch (e) {
    console.error('save wardrobe failed', e);
  }
}

async function saveWishlist() {
  try {
    await window.storage.set('wishlist', JSON.stringify(wishlist));
  } catch (e) {
    console.error('save wishlist failed', e);
  }
}

async function saveSkincare() {
  try {
    await window.storage.set('skincare', JSON.stringify(skincare));
  } catch (e) {
    console.error('save skincare failed', e);
  }
}

async function savePacked() {
  try { await window.storage.set('packed', JSON.stringify(packed)); } catch (e) { console.error('save packed failed', e); }
}

async function loadPacked() {
  try { const r = await window.storage.get('packed'); packed = (r && r.value) ? JSON.parse(r.value) : []; } catch (e) { packed = []; }
}

async function togglePurchased(id, type) {
  const list = type === 'wishlist' ? wishlist : skincare;
  const item = list.find(w => w.id === id);
  if (item) {
    item.purchased = !item.purchased;
    if (type === 'wishlist') {
      await saveWishlist();
    } else {
      // Pour skincare, met à jour le tag aussi (en stock <-> à racheter)
      item.tag = item.purchased ? 'EN STOCK' : 'À RACHETER';
      await saveSkincare();
    }
    render();
  }
}

function needsWash(item) {
  const threshold = WASH_THRESHOLDS[item.type] || 999;
  return item.wears >= threshold;
}

let selectedLevels = [];
let selectedVibes = [];
let randomInclude = [];
let randomExclude = [];
let randomPanel = false;
let outfitPieceFilter = null;
let currentRandomOutfit = null;
let outfitOpts = {};

function vibeLabel(v) { return v === 'jeune' ? 'Jeune' : (v === 'mur' ? 'Mûr' : 'Équilibré'); }
function getOpts(o) {
  if (!outfitOpts[o.id]) outfitOpts[o.id] = { scarf: true, short: false, hat: false, strap: o.watch || 'kaki' };
  return outfitOpts[o.id];
}
function findOutfit(id) { return OUTFITS.find(x => x.id === id) || (currentRandomOutfit && currentRandomOutfit.id === id ? currentRandomOutfit : null); }
function toggleOpt(id, k, v) { const o = findOutfit(id); if (!o) return; getOpts(o)[k] = v; render(); }
function setStrap(id, s) { const o = findOutfit(id); if (!o) return; getOpts(o).strap = s; render(); }
const COOL_TOPS = ['sh1','sh2','sh5','t2','t7','t16','t18','p2'];
function outfitScarf(o) {
  if (o.scarf) return o.scarf;
  const top = o.pieces.find(pid => { const p = wardrobe.find(w => w.id === pid); return p && p.category === 'haut'; });
  return COOL_TOPS.includes(top) ? 'a2' : 'a6';
}
function outfitHasShort(o) {
  if (o.shortSwap) return true;
  return o.pieces.some(pid => { const p = wardrobe.find(w => w.id === pid); return p && p.type === 'short'; });
}
function hatVerdict(o) {
  if (o.hat === true) return { ok: true, why: "jour/exterieur — le Panama finit le look (bord large, pile pour ton visage)." };
  if (o.hat === false) return { ok: false, why: "soir/formel en interieur — le chapeau alourdit ; garde-le pour le jour." };
  if (o.level <= 2) return { ok: true, why: "jour/exterieur — le Panama va bien (bord large pour equilibrer ton visage)." };
  return { ok: false, why: "soiree/ceremonie — pas de Panama en interieur habille ; ok seulement en garden-party exterieur." };
}

function outfitCardHTML(o) {
  const op = getOpts(o);
  const watchMap = { kaki: 'a5', acier: 'a9', cuir: 'a10' };
  const watchId = watchMap[op.strap] || 'a5';
  let pids = o.pieces.map(pid => pid === 'a5' ? watchId : pid);
  if (op.short && o.shortSwap) {
    pids = pids.filter(pid => { const p = wardrobe.find(w => w.id === pid); return !(p && p.category === 'bas'); });
    pids.push(o.shortSwap);
  }
  const scarfId = outfitScarf(o);
  if (op.scarf && scarfId && !pids.includes(scarfId)) pids.push(scarfId);
  const hv = hatVerdict(o);
  if (op.hat && hv.ok && !pids.includes('a12')) pids.push('a12');
  const piecesHTML = pids.map(pid => {
    const piece = wardrobe.find(w => w.id === pid);
    if (!piece) return '';
    const name = piece.name, color = piece.color;
    return `<div class="outfit-piece"><div class="piece-swatch" style="background:${color}"></div><span>${name}</span></div>`;
  }).join('');
  let controls = '<div class="opt-row">';
  controls += `<label class="opt-chip"><input type="checkbox" ${op.scarf ? 'checked' : ''} onchange="toggleOpt('${o.id}','scarf',this.checked)"> 🧣 Écharpe</label>`;
  if (outfitHasShort(o)) controls += `<label class="opt-chip"><input type="checkbox" ${op.short ? 'checked' : ''} onchange="toggleOpt('${o.id}','short',this.checked)"> 🩳 Short</label>`;
  if (hv.ok) controls += `<label class="opt-chip"><input type="checkbox" ${op.hat ? 'checked' : ''} onchange="toggleOpt('${o.id}','hat',this.checked)"> 👒 Panama</label>`;
  controls += `<span class="strap-toggle">⌚ <button class="${op.strap === 'kaki' ? 'on' : ''}" onclick="setStrap('${o.id}','kaki')">NATO</button><button class="${op.strap === 'acier' ? 'on' : ''}" onclick="setStrap('${o.id}','acier')">Acier</button><button class="${op.strap === 'cuir' ? 'on' : ''}" onclick="setStrap('${o.id}','cuir')">Cuir</button></span>`;
  controls += '</div>';
  const t = o.tips || {};
  let tips = '<div class="tips">';
  if (t.tuck) tips += `<div><b>Tuck :</b> ${t.tuck}</div>`;
  if (t.buttons) tips += `<div><b>Boutons :</b> ${t.buttons}</div>`;
  if (t.sleeves) tips += `<div><b>Manches :</b> ${t.sleeves}</div>`;
  tips += `<div><b>Écharpe :</b> ${t.scarf || 'boucle lâche, pans inégaux qui pendent — jamais serré'}</div>`;
  const watchName = (wardrobe.find(w => w.id === watchId) || {}).name || 'Montre';
  tips += `<div><b>Montre :</b> ${watchName}${t.strap ? ' — ' + t.strap : ''}</div>`;
  tips += `<div><b>Chapeau :</b> ${hv.ok ? '✓ oui' : '✗ non'} — ${hv.why}</div>`;
  if (t.note) tips += `<div><b>+</b> ${t.note}</div>`;
  tips += '</div>';
  const scarfName = (wardrobe.find(w => w.id === scarfId) || {}).name || '';
  // Photo de la tenue (IndexedDB, cache memoire)
  const photo = photoCache[o.id];
  const photoHTML = photo
    ? `<img class="photo-thumb" src="${photo}" onclick="viewPhoto('${o.id}')" alt="Photo de la tenue">`
    : '';
  const photoActions = o.id === 'libre' ? '' : `<div class="photo-actions">
      <button class="photo-btn" onclick="pickPhoto('${o.id}')">📷 ${photo ? 'Changer la photo' : 'Ajouter une photo'}</button>
      ${photo ? `<button class="photo-btn" onclick="removePhoto('${o.id}')">🗑️</button>` : ''}
      <button class="photo-btn" onclick="wearToday('${o.id}')">✓ Porté aujourd'hui</button>
    </div>`;

  return `<div class="outfit-card">
    <div class="outfit-header"><div class="outfit-name">${o.name}</div><div class="badges"><span class="vibe-badge v-${o.vibe}">${vibeLabel(o.vibe)}</span><span class="outfit-level">niv. ${o.level}</span></div></div>
    ${photoHTML}
    <p style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-style:italic">${o.description}</p>
    <div class="outfit-pieces">${piecesHTML}</div>
    ${controls}
    <p style="font-size:10px;color:var(--ink-faded);font-family:var(--mono);margin:2px 0 0">écharpe → ${scarfName}</p>
    ${photoActions}
    ${tips}
  </div>`;
}

function renderOutfits() {
  const lvlNames = ['Relax', 'Chic décontracté', 'Soirée', 'Cérémonie'];
  const fp = outfitPieceFilter ? (wardrobe.find(w => w.id === outfitPieceFilter) || null) : null;
  const list = fp ? OUTFITS.filter(o => outfitHasPiece(o, outfitPieceFilter)) : OUTFITS;
  let html = `<h2 class="section-title">Tenues</h2>`;

  // Bandeau generation (Claude)
  if (!fp) {
    html += `<div class="gen-panel">`;
    if (genBusy) {
      html += `<div class="ai-spin">${genBusyMsg || 'Génération en cours…'}</div>`;
    } else {
      if (pendingPieces.length > 0) {
        html += `<div class="gen-pending">
          <span>${pendingPieces.length} nouvelle(s) pièce(s) en attente</span>
          <button onclick="runIncrementalGen()">Générer leurs tenues</button>
        </div>`;
      }
      html += `<div class="gen-row">
        <span class="gen-count">${generatedOutfits.length} tenue(s) générée(s) par Claude · ${CURATED_OUTFITS.length} curatées</span>
        <button class="gen-btn" onclick="runFullGen()">${generatedOutfits.length ? 'Tout regénérer' : 'Générer mes tenues'}</button>
      </div>`;
    }
    html += `</div>`;
  }

  if (fp) {
    html += `<div class="outfit-banner"><span>👔 ${list.length} tenue(s) avec <b>${fp.name}</b></span><button onclick="clearOutfitPieceFilter()">✕</button></div>`;
  } else {
    html += `<p class="section-subtitle">${OUTFITS.length} compositions · coche écharpe / short, choisis le bracelet</p>`;
  }
  for (let l = 1; l <= 4; l++) {
    const os = list.filter(o => o.level === l);
    if (!os.length) continue;
    html += `<div class="lvl-head">Niveau ${l} · ${lvlNames[l - 1]}</div>`;
    html += os.map(outfitCardHTML).join('');
  }
  return html;
}

async function logWear(id) {
  const item = wardrobe.find(w => w.id === id);
  if (item) {
    item.wears += 1;
    await saveWardrobe();
    render();
    openItem(id);
  }
}

async function washItem(id) {
  const item = wardrobe.find(w => w.id === id);
  if (item) {
    item.wears = 0;
    await saveWardrobe();
    render();
    openItem(id);
  }
}

async function deleteItem(id) {
  if (!confirm('Supprimer cette pièce ?')) return;
  wardrobe = wardrobe.filter(w => w.id !== id);
  await saveWardrobe();
  // Retire localement (0 token) les tenues qui utilisaient cette piece
  const removed = pruneOutfitsForRemovedPiece(id);
  if (removed) await saveGenerated();
  pendingPieces = pendingPieces.filter(p => p !== id);
  await savePending();
  // Supprime aussi sa photo
  await deletePhoto('piece-' + id);
  delete photoCache['piece-' + id];
  closeModal();
  render();
  if (removed) setTimeout(() => alert(`Pièce supprimée · ${removed} tenue(s) retirée(s) (sans appel IA).`), 100);
}

let addPhoto = null;      // dataURL de la photo de la piece
let addAnalyzing = false;

// Analyse la photo -> pre-remplit le formulaire
async function analyzeNewPiece() {
  if (!addPhoto || addAnalyzing) return;
  addAnalyzing = true;
  const btn = document.getElementById('ad-analyze');
  if (btn) { btn.disabled = true; btn.textContent = 'Analyse en cours…'; }
  try {
    const out = await callClaude('analyze', {
      image: addPhoto.split(',')[1],
      mediaType: 'image/jpeg',
      text: "Analyse cette piece de vetement."
    });
    const d = parseJSONLoose(out);
    if (!d) throw new Error('Reponse illisible');

    const set = (id, v) => { const el = document.getElementById(id); if (el && v !== undefined && v !== null) el.value = v; };
    set('ad-name', d.name);
    set('ad-color', d.color);
    set('ad-color-text', d.color);
    if (d.type) {
      const sel = document.getElementById('ad-type');
      if (sel && [...sel.options].some(o => o.value === d.type)) sel.value = d.type;
    }
    set('ad-note', d.note);
    // memorise la famille et le tuck pour le moteur
    window._aiMeta = { family: d.family, material: d.material, faceOk: d.faceOk };

    const info = document.getElementById('ad-ai-info');
    if (info) {
      info.innerHTML = `✓ ${d.colorName || ''} · ${d.material || ''} · famille <b>${d.family || '?'}</b>`
        + (d.inPalette === false ? ' · <span style="color:var(--alert)">hors palette</span>' : ' · dans ta palette')
        + (d.faceOk === false ? ' · <span style="color:var(--alert)">a porter en layer</span>' : '');
    }
  } catch (e) {
    alert("Analyse impossible : " + e.message);
  }
  addAnalyzing = false;
  if (btn) { btn.disabled = false; btn.textContent = '🔍 Analyser la photo'; }
}

function pickAddPhoto() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = async () => {

    if (!f) return;
    try {
      addPhoto = await compressImage(f, 900, 0.75);
      const box = document.getElementById('ad-photo-box');
      if (box) box.innerHTML =
        `<img class="ai-preview" src="${addPhoto}" alt="Piece">

         <div class="field-ai" id="ad-ai-info"></div>`;
    } catch (e) { alert('Image illisible.'); }
  };
  inp.click();
}

async function saveAdd() {
  const name = document.getElementById('ad-name').value.trim();
  if (!name) return alert('Donne un nom à la pièce');
  const type = document.getElementById('ad-type').value;
  let category = 'accessoire';
  for (const [cat, types] of Object.entries(CATEGORIES)) {
    if (types.includes(type)) { category = cat; break; }
  }
  const meta = window._aiMeta || {};
  const id = 'u' + Date.now();
  const newItem = {
    id,
    name,
    brand: document.getElementById('ad-brand').value || '—',
    color: document.getElementById('ad-color').value,
    type,
    category,
    wears: 0,
    note: document.getElementById('ad-note').value || undefined,
    family: meta.family || undefined,
    material: meta.material || undefined,
    tuckable: (type === 'chino' || type === 'pantalon-lin') ? undefined : undefined
  };
  wardrobe.push(newItem);
  await saveWardrobe();

  // Photo de la piece
  if (addPhoto) {
    await savePhoto('piece-' + id, addPhoto);
    photoCache['piece-' + id] = addPhoto;
  }

  // File d'attente : on regroupe les ajouts, la generation se lance a la demande
  if (['haut','bas','surcouche','chaussure'].includes(category)) {
    if (!pendingPieces.includes(id)) { pendingPieces.push(id); await savePending(); }
  }

  addPhoto = null;
  window._aiMeta = null;
  closeModal();
  render();

  const pending = pendingPieces.length;
  if (pending > 0) {
    if (confirm(`✓ ${name} ajoutée.\n\n${pending} pièce(s) en attente de génération. Composer leurs tenues maintenant ?`)) {
      currentTab = 'outfits';
      await runIncrementalGen();
    }
  } else {
    alert(`✓ ${name} ajoutée à ta garde-robe.`);
  }
}

// ============ GENERATION : contexte UI ============
let genBusy = false;
let genBusyMsg = '';

async function runFullGen() {
  if (genBusy) return;
  if (generatedOutfits.length && !confirm('Regénérer tout le catalogue ? Cela remplace les tenues générées actuelles (les curatées restent).')) return;
  genBusy = true; genBusyMsg = 'Claude compose tes tenues… (30-60 s)'; render();
  try {
    const res = await generateAllOutfits();
    pendingPieces = []; await savePending();
    genBusy = false; render();
    alert(`✓ ${res.kept} tenue(s) générée(s).` + (res.dropped ? `\n${res.dropped} écartée(s) (règle non respectée).` : ''));
  } catch (e) {
    genBusy = false; render();
    alert('Échec de la génération : ' + e.message + '\n\n(Vérifie ANTHROPIC_API_KEY dans Vercel.)');
  }
}

async function runIncrementalGen() {
  if (genBusy || !pendingPieces.length) return;
  const ids = pendingPieces.slice();
  genBusy = true; genBusyMsg = `Claude compose les tenues de ${ids.length} nouvelle(s) pièce(s)…`; render();
  try {
    const added = await generateForNewPieces(ids);
    pendingPieces = []; await savePending();
    genBusy = false; render();
    alert(`✓ ${added} nouvelle(s) tenue(s) ajoutée(s).`);
  } catch (e) {
    genBusy = false; render();
    alert('Échec : ' + e.message);
  }
}

// Une tenue est "faisable avec la valise" si tous ses vêtements (hors accessoires) sont cochés
function outfitInValise(o) {
  return o.pieces.every(pid => {
    const p = wardrobe.find(w => w.id === pid);
    if (!p) return true;
    if (p.category === 'accessoire') return true;
    return packed.includes(pid);
  });
}

function cycleRandomPiece(id) {
  if (randomInclude.includes(id)) { randomInclude = randomInclude.filter(x => x !== id); randomExclude.push(id); }
  else if (randomExclude.includes(id)) { randomExclude = randomExclude.filter(x => x !== id); }
  else { if (randomInclude.length < 2) randomInclude.push(id); else randomExclude.push(id); }
  currentRandomOutfit = null; render();
}

function clearRandomFilters() {
  selectedLevels = []; selectedVibes = []; randomInclude = []; randomExclude = [];
  currentRandomOutfit = null; render();
}

function outfitHasPiece(o, id) { return o.pieces.includes(id) || o.scarf === id || o.shortSwap === id; }

function goTab(tab) {
  currentTab = tab; currentFilter = 'all';
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
}

function showOutfitsWith(id) { outfitPieceFilter = id; closeModal(); goTab('outfits'); }
function clearOutfitPieceFilter() { outfitPieceFilter = null; render(); }

function rollOutfit() {
  let pool = OUTFITS.filter(o =>
    (selectedLevels.length === 0 || selectedLevels.includes(o.level)) &&
    (selectedVibes.length === 0 || selectedVibes.includes(o.vibe)) &&
    (!valiseOnly || outfitInValise(o)) &&
    (!shortMode || outfitHasShort(o)) &&
    randomInclude.every(pid => outfitHasPiece(o, pid)) &&
    randomExclude.every(pid => !outfitHasPiece(o, pid))
  );
  if (pool.length === 0) {
    currentRandomOutfit = {
      id: 'libre', name: 'Rien à ce filtre', level: (selectedLevels[0] || 1), vibe: (selectedVibes[0] || 'inter'),
      description: "Aucune tenue ne coche tous ces filtres. Assouplis les niveaux/styles, ou enlève une pièce incluse/exclue.",
      pieces: [], scarf: null, shortSwap: null, watch: 'kaki', hat: false, tips: {}
    };
  } else {
    let pick;
    if (currentRandomOutfit && currentRandomOutfit.id !== 'libre') {
      const others = pool.filter(o => o.id !== currentRandomOutfit.id);
      pick = others.length > 0 ? others[Math.floor(Math.random() * others.length)] : pool[0];
    } else {
      pick = pool[Math.floor(Math.random() * pool.length)];
    }
    currentRandomOutfit = pick;
    if (pick && pick.shortSwap && (shortMode || randomInclude.includes(pick.shortSwap))) getOpts(pick).short = true;
  }
  render();
}

async function logWearOutfit() {
  if (!currentRandomOutfit) return;
  await recordWear(currentRandomOutfit);
  alert('Tenue enregistrée ✓ Compteurs + journal mis à jour.');
  render();
}

// Enregistre un port : incremente les compteurs + ajoute au journal
async function recordWear(o) {
  if (!o || o.id === 'libre') return;
  for (const pid of o.pieces) {
    const item = wardrobe.find(w => w.id === pid);
    if (item) item.wears += 1;
  }
  await saveWardrobe();
  wearLog.unshift({
    id: 'w' + Date.now(),
    date: new Date().toISOString(),
    outfitId: o.id,
    name: o.name,
    level: o.level
  });
  await saveWearLog();
}

async function saveWearLog() {
  await window.storage.set('wearlog', JSON.stringify(wearLog));
}

async function deleteLogEntry(entryId) {
  const entry = wearLog.find(e => e.id === entryId);
  if (!entry) return;
  if (!confirm('Supprimer cette entrée du journal ?')) return;
  // On décrémente aussi les compteurs de port
  const o = OUTFITS.find(x => x.id === entry.outfitId);
  if (o) {
    for (const pid of o.pieces) {
      const item = wardrobe.find(w => w.id === pid);
      if (item && item.wears > 0) item.wears -= 1;
    }
    await saveWardrobe();
  }
  wearLog = wearLog.filter(e => e.id !== entryId);
  await saveWearLog();
  render();
}

// Depuis l'onglet Tenues : marquer une tenue comme portée aujourd'hui
async function wearToday(outfitId) {
  const o = OUTFITS.find(x => x.id === outfitId);
  if (!o) return;
  await recordWear(o);
  render();
}

function fmtLogDate(iso) {
  const d = new Date(iso);
  const today = new Date();
  const y = new Date(today); y.setDate(y.getDate() - 1);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return "Aujourd'hui";
  if (same(d, y)) return 'Hier';
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderJournal() {
  let html = `<h2 class="section-title">Journal de port</h2>`;

  if (wearLog.length === 0) {
    html += `<p class="section-subtitle">Aucune tenue enregistrée pour l'instant. Tire une tenue dans l'aléatoire et coche « J'ai porté ça », ou utilise le bouton « porté aujourd'hui » sur une tenue.</p>`;
  } else {
    // Stats
    const counts = {};
    wearLog.forEach(e => { counts[e.outfitId] = (counts[e.outfitId] || 0) + 1; });
    let topId = null, topN = 0;
    Object.entries(counts).forEach(([k, v]) => { if (v > topN) { topN = v; topId = k; } });
    const topOutfit = OUTFITS.find(o => o.id === topId);
    const last30 = wearLog.filter(e => (Date.now() - new Date(e.date)) < 30 * 864e5).length;

    html += `<div class="log-stat">
      <b>${wearLog.length}</b> port(s) enregistré(s) · <b>${last30}</b> sur les 30 derniers jours<br>
      ${topOutfit ? `Ta tenue la plus portée : <b>${topOutfit.name}</b> (${topN}×)` : ''}
    </div>`;

    html += `<p class="section-subtitle">${wearLog.length} entrée(s) · la plus récente en haut</p>`;
    html += wearLog.map(e => `
      <div class="log-entry">
        <div>
          <div class="log-date">${fmtLogDate(e.date)}</div>
          <div class="log-name">${e.name}</div>
        </div>
        <button class="log-del" onclick="deleteLogEntry('${e.id}')" title="Supprimer">✕</button>
      </div>
    `).join('');
  }

  // Bloc donnees
  html += `<div class="subcat-head">Mes données</div>
    <button class="data-btn" onclick="exportData()">⬇️ Exporter mes données (JSON)</button>
    <button class="data-btn" onclick="document.getElementById('importFile').click()">⬆️ Importer une sauvegarde</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">
    <p style="font-size:11px;color:var(--ink-faded);text-align:center;margin-top:8px">
      Version ${APP_VERSION} · Sauvegarde tes données avant de changer de téléphone ou de vider le cache.
    </p>`;

  return html;
}

// ============ MIROIR : correction d'une tenue portee ============
let mirrorImage = null;   // { data: base64, mediaType }
let mirrorResult = null;
let mirrorBusy = false;

function renderMirror() {
  let html = `<h2 class="section-title">Miroir</h2>
    <p class="section-subtitle">Photographie ta tenue, je la corrige selon ta palette et tes regles</p>`;

  html += `<div class="ai-box">`;

  if (mirrorImage) {
    html += `<img class="ai-preview" src="data:${mirrorImage.mediaType};base64,${mirrorImage.data}" alt="Tenue">`;
  } else {
    html += `<div class="ai-drop" onclick="pickMirrorPhoto()">
      📸<br><br>Touche pour prendre ou choisir une photo<br>
      <span style="font-size:11px;color:var(--ink-faded)">de pied de preference, lumiere naturelle</span>
    </div>`;
  }

  if (mirrorBusy) {
    html += `<div class="ai-spin">Analyse en cours…</div>`;
  } else if (mirrorResult) {
    const v = /VERDICT\s*:\s*(.+)$/im.exec(mirrorResult);
    const body = mirrorResult.replace(/VERDICT\s*:.*$/im, '').trim();
    let badge = '';
    if (v) {
      const t = v[1].toLowerCase();
      const cls = t.includes('valid') ? 'v-ok' : (t.includes('non') ? 'v-no' : 'v-adj');
      badge = `<div><span class="verdict ${cls}">${v[1].trim()}</span></div>`;
    }
    html += `<div class="ai-result">${body}</div>${badge}`;
  }

  if (mirrorImage) {
    html += `<div class="photo-actions" style="margin-top:12px">
      <button class="photo-btn" onclick="pickMirrorPhoto()">Changer la photo</button>
      ${!mirrorBusy && !mirrorResult ? `<button class="photo-btn" onclick="runMirror()" style="background:var(--accent-soft);color:var(--ink);font-weight:600">Analyser</button>` : ''}
      <button class="photo-btn" onclick="resetMirror()">Effacer</button>
    </div>`;
  }

  html += `</div>`;

  html += `<p style="font-size:11px;color:var(--ink-faded);text-align:center">
    Seule cette analyse consomme des tokens. Le reste de l'app (tenues, aleatoire, journal) est 100% local.
  </p>`;

  return html;
}

function pickMirrorPhoto() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try {
      const dataUrl = await compressImage(f, 1100, 0.8);
      mirrorImage = { data: dataUrl.split(',')[1], mediaType: 'image/jpeg' };
      mirrorResult = null;
      render();
    } catch (e) { alert('Image illisible.'); }
  };
  inp.click();
}

async function runMirror() {
  if (!mirrorImage || mirrorBusy) return;
  mirrorBusy = true; render();
  try {
    mirrorResult = await callClaude('review', {
      image: mirrorImage.data,
      mediaType: mirrorImage.mediaType,
      text: "Juge cette tenue."
    });
  } catch (e) {
    mirrorResult = "Erreur : " + e.message + "\n\n(Verifie que ANTHROPIC_API_KEY est bien definie dans Vercel.)";
  }
  mirrorBusy = false;
  render();
}

function resetMirror() {
  mirrorImage = null; mirrorResult = null; mirrorBusy = false;
  render();
}

// ============ EXPORT / IMPORT ============
async function exportData() {
  const photos = await loadAllPhotos();
  const payload = {
    app: 'garde-robe',
    version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    wardrobe, wishlist, skincare, packed, wearLog, photos
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'garde-robe-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function importData(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!confirm('Remplacer tes données actuelles par cette sauvegarde ?')) { input.value = ''; return; }
  try {
    const txt = await file.text();
    const d = JSON.parse(txt);
    if (d.wardrobe) { wardrobe = d.wardrobe; await saveWardrobe(); }
    if (d.wishlist) { wishlist = d.wishlist; await saveWishlist(); }
    if (d.skincare) { skincare = d.skincare; await saveSkincare(); }
    if (d.packed) { packed = d.packed; await window.storage.set('packed', JSON.stringify(packed)); }
    if (d.wearLog) { wearLog = d.wearLog; await saveWearLog(); }
    if (d.photos) {
      for (const [k, v] of Object.entries(d.photos)) { if (v) await savePhoto(k, v); }
      photoCache = await loadAllPhotos();
    }
    alert('Sauvegarde importée ✓');
    render();
  } catch (e) {
    alert("Échec de l'import : fichier illisible.");
  }
  input.value = '';
}

// ============ PHOTOS : actions ============
function pickPhoto(outfitId) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    try {
      const data = await compressImage(f);
      await savePhoto(outfitId, data);
      photoCache[outfitId] = data;
      render();
    } catch (e) { alert('Impossible de lire cette image.'); }
  };
  inp.click();
}

async function removePhoto(outfitId) {
  if (!confirm('Supprimer la photo de cette tenue ?')) return;
  await deletePhoto(outfitId);
  delete photoCache[outfitId];
  render();
}

function viewPhoto(outfitId) {
  const src = photoCache[outfitId];
  if (!src) return;
  document.getElementById('modalContent').innerHTML =
    `<img src="${src}" style="width:100%;border-radius:8px;display:block">
     <button class="btn" style="width:100%;margin-top:14px;border:none;background:transparent" onclick="closeModal()">Fermer</button>`;
  document.getElementById('modalBackdrop').classList.add('show');
}

// ============ MAIN RENDER ============
function render() {
  const content = document.getElementById('content');
  switch(currentTab) {
    case 'wardrobe':
      content.innerHTML = renderWardrobe();
      document.getElementById('fab').style.display = 'flex';
      break;
    case 'palette':
      content.innerHTML = renderPalette();
      document.getElementById('fab').style.display = 'none';
      break;
    case 'outfits':
      content.innerHTML = renderOutfits();
      document.getElementById('fab').style.display = 'none';
      break;
    case 'random':
      content.innerHTML = renderRandom();
      document.getElementById('fab').style.display = 'none';
      break;
    case 'wishlist':
      content.innerHTML = renderWishlist();
      document.getElementById('fab').style.display = 'none';
      break;
    case 'mirror':
      content.innerHTML = renderMirror();
      document.getElementById('fab').style.display = 'none';
      break;
    case 'journal':
      content.innerHTML = renderJournal();
      document.getElementById('fab').style.display = 'none';
      break;
    case 'skincare':
      content.innerHTML = renderSkincare();
      document.getElementById('fab').style.display = 'none';
      break;
  }
}

// ============ INIT ============
async function init() {
  document.getElementById('content').innerHTML = '<div class="loading">Chargement de ta garde-robe...</div>';

  await loadWardrobe();
  await loadPacked();
  await loadWearLog();
  await loadGenerated();
  await loadPending();
  photoCache = await loadAllPhotos();

  const today = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  document.getElementById('todayDate').textContent = today;

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      currentFilter = 'all';
      render();
    });
  });

  document.getElementById('fab').addEventListener('click', openAddItem);

  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });

  render();
}

async function loadWearLog() {
  try {
    const r = await window.storage.get('wearlog');
    wearLog = r && r.value ? JSON.parse(r.value) : [];
  } catch (e) { wearLog = []; }
}

// ============ PWA : service worker + mise a jour ============
let _newWorker = null;

function applyUpdate() {
  if (_newWorker) {
    _newWorker.postMessage({ type: 'SKIP_WAITING' });
  }
  location.reload();
}

function showUpdateBanner() {
  const b = document.getElementById('updateBanner');
  if (b) b.classList.add('show');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Nouvelle version detectee pendant la session
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            _newWorker = nw;
            showUpdateBanner();
          }
        });
      });
      // Verifie les mises a jour au lancement et toutes les 30 min
      reg.update();
      setInterval(() => reg.update(), 30 * 60 * 1000);
    }).catch(() => {});

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
  });
}

// Compare version.json au numero embarque (banniere meme sans SW)
async function checkVersion() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.version && d.version !== APP_VERSION) showUpdateBanner();
  } catch (e) {}
}
checkVersion();

init();
</script>
